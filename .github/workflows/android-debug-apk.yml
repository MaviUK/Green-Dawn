name: Build Green Dawn Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check bundled game
        run: |
          test -f index.html
          test -f android/app/src/main/assets/index.html
          cmp index.html android/app/src/main/assets/index.html
          grep -q 'GREEN_DAWN_TEST' android/app/src/main/assets/index.html
          grep -q 'JUNGLE ASSAULT' android/app/src/main/assets/index.html
      - name: Test campaign and mission progression
        run: node --test tests/campaign.test.cjs
      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners already include the Android SDK and
      # command-line tools. The old setup-android@v3 action attempts to
      # install the removed SDK package named "tools" and fails.
      - name: Locate preinstalled Android SDK tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER_BIN="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER_BIN" ] || [ ! -x "$SDKMANAGER_BIN" ]; then
            echo "::error::Android SDK command-line tools not installed under ANDROID_HOME"
            exit 1
          fi
          echo "Using $SDKMANAGER_BIN"
          echo "$(dirname "$SDKMANAGER_BIN")" >> "$GITHUB_PATH"
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify output
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK for Android phone
        uses: actions/upload-artifact@v4
        with:
          name: green-dawn-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish downloadable Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GreenDawn-Campaign-v0.11-debug.apk
          if gh release view v0.11.0 >/dev/null 2>&1; then
            gh release upload v0.11.0 GreenDawn-Campaign-v0.11-debug.apk --clobber
          else
            gh release create v0.11.0 GreenDawn-Campaign-v0.11-debug.apk \
              --target "$GITHUB_SHA" \
              --title "Green Dawn v0.11.0 — Android test build" \
              --notes "Green Dawn v0.11 adds the third playable mission: RADAR BLACKOUT. Move through a new dark-green jungle and timber bridge, destroy the animated enemy radar installation, then reach extraction while enemy reinforcements arrive. Saved v0.10 campaigns with Mission 02 complete can advance immediately into Mission 03. No mission selection/replay; careers, memorials, retro artwork and controls are preserved. GitHub Actions now checks campaign progression and memorial logic before building. Debug APK signing may vary; uninstalling an earlier build deletes its locally saved campaign." \
              --prerelease
          fi

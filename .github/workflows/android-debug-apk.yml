name: Build Green Dawn Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'ww2-campaign.html'
      - 'ww2-campaign-data.js'
      - 'norway-missions.js'
      - 'tests/**'
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check bundled game
        run: |
          test -f index.html
          test -f android/app/src/main/assets/index.html
          cmp index.html android/app/src/main/assets/index.html
          cmp ww2-campaign.html android/app/src/main/assets/ww2-campaign.html
          cmp ww2-campaign-data.js android/app/src/main/assets/ww2-campaign-data.js
          cmp norway-missions.js android/app/src/main/assets/norway-missions.js
          grep -q 'GREEN_DAWN_TEST' android/app/src/main/assets/index.html
          grep -q 'JUNGLE ASSAULT' android/app/src/main/assets/index.html
      - name: Test campaign and mission progression
        run: node --test tests/campaign.test.cjs
      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners already include the Android SDK and
      # command-line tools. The old setup-android@v3 action attempts to
      # install the removed SDK package named "tools" and fails.
      - name: Locate preinstalled Android SDK tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER_BIN="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER_BIN" ] || [ ! -x "$SDKMANAGER_BIN" ]; then
            echo "::error::Android SDK command-line tools not installed under ANDROID_HOME"
            exit 1
          fi
          echo "Using $SDKMANAGER_BIN"
          echo "$(dirname "$SDKMANAGER_BIN")" >> "$GITHUB_PATH"
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Configure persistent signing (optional)
        env:
          GREEN_DAWN_KEYSTORE_B64: ${{ secrets.GREEN_DAWN_KEYSTORE_B64 }}
          GREEN_DAWN_KEYSTORE_PASSWORD: ${{ secrets.GREEN_DAWN_KEYSTORE_PASSWORD }}
          GREEN_DAWN_KEY_ALIAS: ${{ secrets.GREEN_DAWN_KEY_ALIAS }}
          GREEN_DAWN_KEY_PASSWORD: ${{ secrets.GREEN_DAWN_KEY_PASSWORD }}
        run: |
          if [ -n "$GREEN_DAWN_KEYSTORE_B64" ]; then
            if [ -z "$GREEN_DAWN_KEYSTORE_PASSWORD" ] || [ -z "$GREEN_DAWN_KEY_ALIAS" ] || [ -z "$GREEN_DAWN_KEY_PASSWORD" ]; then
              echo "::error::Persistent signing needs all four GitHub Actions secrets"
              exit 1
            fi
            printf '%s' "$GREEN_DAWN_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/green-dawn.jks"
            chmod 600 "$RUNNER_TEMP/green-dawn.jks"
            echo "GREEN_DAWN_KEYSTORE_PATH=$RUNNER_TEMP/green-dawn.jks" >> "$GITHUB_ENV"
            echo "Persistent signing certificate configured"
          else
            echo "::warning::Using a temporary debug certificate. Android may reject in-place upgrades"
          fi
      - name: Build APK
        working-directory: android
        env:
          GREEN_DAWN_KEYSTORE_PASSWORD: ${{ secrets.GREEN_DAWN_KEYSTORE_PASSWORD }}
          GREEN_DAWN_KEY_ALIAS: ${{ secrets.GREEN_DAWN_KEY_ALIAS }}
          GREEN_DAWN_KEY_PASSWORD: ${{ secrets.GREEN_DAWN_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify output
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK for Android phone
        uses: actions/upload-artifact@v4
        with:
          name: green-dawn-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish downloadable Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GreenDawn-Campaign-v0.14-debug.apk
          if gh release view v0.14.0 >/dev/null 2>&1; then
            gh release upload v0.14.0 GreenDawn-Campaign-v0.14-debug.apk --clobber
          else
            gh release create v0.14.0 GreenDawn-Campaign-v0.14-debug.apk \
              --target "$GITHUB_SHA" \
              --title "Green Dawn v0.14.0 — Android test build" \
              --notes "Green Dawn v0.14 finishes the full six-mission NORWAY 1940 chapter. New playable: 002 Mountain Patrol with three sequential ridge captures, 003 The Supply Route with a moving and damageable ammunition cart plus ambushes, 004 Guns Above the Fjord with two distinct artillery positions, 005 Narvik Harbour with signal sabotage and sailor rescue, and 006 Last Ships from Norway: three defences, a 35-second pier defence under enemy counterattacks, then boarding the evacuation ship. Distinct frozen mountain, blizzard, fjord cliff, harbour and siege maps with original pixel art. All six levels auto-unlock in order with permanent soldier promotions, casualties, mission-only ceremony and no replay. Prior v0.13 Norway 001 saves are kept via the same WWII save key; jungle campaign remains separate and unchanged. Remaining 007-100 levels stay locked. Automated 24-test regression suite checks mission completion, backups and preservation. Note: debug APK signing is temporary unless private GitHub signing secrets are configured, so uninstalling the previous app erases its local saves." \
              --prerelease
          fi

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#151d13">
  <meta name="description" content="Green Dawn — original pixel tactics with a jungle campaign and an evolving WWII Road to Berlin campaign.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  
  <title>GREEN DAWN — Campaign</title>
  <style>
    * { box-sizing:border-box; }
    :root{color-scheme:dark;--dark:#111812;--olive:#344a2e;--sand:#d7c58e;--mint:#c0dba4}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--dark);color:#f0e7c9;font-family:"Courier New",monospace}
    html{-webkit-tap-highlight-color:transparent}
    #game-container{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#101711;overflow:hidden}
    #game{display:block;width:100%;height:100%;object-fit:fill;touch-action:none;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair;outline:none}
    #orientation{display:none;z-index:50;position:absolute;inset:0;background:#151d13;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:26px}
    #orientation .icon{font-size:58px;line-height:1}
    #orientation h1{font-size:22px;margin:0;color:#f0d478;letter-spacing:3px}
    #orientation p{font-size:13px;max-width:280px;line-height:1.7;color:#bdc7a5}
    @media (orientation:portrait) and (max-width:800px){#orientation{display:flex} #game{opacity:.2}}
  </style>
</head>
<body>
  <main id="game-container">
    <canvas id="game" tabindex="0" aria-label="Green Dawn jungle assault game. Landscape game. Tap to move, hold to fire, drag to aim. Tap SPLIT to make Alpha and Bravo groups; select either group or a soldier, hold a soldier name to transfer, tap JOIN to reunite."></canvas>
    <div id="orientation" role="status"><div class="icon">↻</div><h1>ROTATE TO DEPLOY</h1><p>Turn your phone sideways for the full 16-bit battlefield.</p></div>
  </main>
  <script src="norway-missions.js"></script>
  <script src="dunkirk-missions.js"></script>
  <script>
/*
  GREEN DAWN v0.15 — NORWAY + DUNKIRK CAMPAIGNS
  Original game, procedural pixel art, original gameplay code and synthesized SFX.
  No art/music/code from Cannon Fodder or any other game is used.
*/
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', {alpha:false});
  const WH = 288, HUD = 110, CTRL_Y=253, MW=1024, MH=672, CELL=16;
  const COLS=Math.ceil(MW/CELL), ROWS=Math.ceil(MH/CELL);
  const C = { ink:'#101712', edge:'#0b100d', dark:'#1c261c', steel:'#293428', olive:'#43572e',
    green:'#90b963', mint:'#c2db94', cream:'#f5e6bd', sand:'#e4c873', gold:'#f3c95b',
    danger:'#e27e52', hud:'#20291f', red:'#a73d32', shadow:'#162015' };
  const DIFFICULTY = { enemySight:142, enemyFire:1.50, gunRate:.18, moveSpeed:73, grenadeRadius:53 };
  const ENEMY_AI = {hearing:198, alertDuration:4.5, coverRadius:80, suppressionRadius:21};
  let W=512,VW=402,VH=CTRL_Y,state='title',mode='move',selected=-1,split=false;
  let missionIndex=1,renderedMission=0; // current operation is determined by the saved campaign
  let cam={x:0,y:0}, pointer={x:0,y:0,wx:0,wy:0,down:false,firePointer:null};
  const HOLD_TO_FIRE_MS=240; // one finger: quick tap moves, long hold shoots
  const MARCH_GAP=19, TRAIL_STEP=3, TRAIL_LIMIT=620; // one-file marching, each soldier follows actual footsteps
  let gesture=null; // {id,started,x,y,wx,wy,firing}; active battlefield finger only
  let hudPress=null; // hold a soldier row to transfer between Alpha and Bravo
  let soldiers=[],enemies=[],bullets=[],bombs=[],particles=[],decals=[],trees=[],rocks=[];
  let gunEffects=[],fallenBodies=[]; // tiny transient pixel art combat effects
  let bunker,ammo,extraction={x:319,y:91,r:25},terrain,mapData=[],clock=0,shotClock=0,fireUntil=0,aim={x:0,y:0};
  let score=0,kills=0,grenades=3,started=0,freeze=0,message='',messageTime=0,panHint=0;
  let timeNow=0,mouseRight=false,hasAudio=false,audioOn=true,audioCtx=null,objectiveArrow=0;
  let playerShots=0,reinforcementsSent=false;
  const IS_WW2=/(?:^|[?&])campaign=ww2(?:&|$)/.test(window.location.search||'');
  const NORWAY=IS_WW2?window.GREEN_DAWN_NORWAY:null;
  const DUNKIRK=IS_WW2?window.GREEN_DAWN_DUNKIRK:null;
  if(IS_WW2&&(!NORWAY||NORWAY.missions.length!==6||!DUNKIRK||DUNKIRK.missions.length!==6))
    throw Error('WWII campaign chapter data missing');
  const CAMPAIGN_MISSIONS=IS_WW2?12:3;
  const CAMPAIGN_PLAN=IS_WW2?100:3;
  // Separate soldier careers: existing jungle saves are untouched.
  const CAREER_KEY=IS_WW2?'green-dawn-ww2-campaign-v1':'green-dawn-campaign-v1';
  const MAX_DEPLOY=3,RECRUITS_PER_VICTORY=2;
  const BACKUP_FORMAT=IS_WW2?'GREEN_DAWN_WW2_SAVE':'GREEN_DAWN_SAVE';
  const BACKUP_VERSION=1,BACKUP_MAX_CHARS=240000;
  let backupStatus='KEEP A COPY OF YOUR SOLDIERS',pendingBackup=null;
  const RANKS=['RECRUIT','PRIVATE','L/CPL','CORPORAL','SERGEANT','STAFF SGT','WARRANT','LIEUTENANT','CAPTAIN','MAJOR','COLONEL'];
  const SHORT_RANKS=['RCT','PVT','LCP','CPL','SGT','SSG','WO','LT','CPT','MAJ','COL'];
  const RECRUIT_NAMES=IS_WW2?
    ['JACK','TOM','ALF','BERT','HARRY','SID','ARTHUR','FRANK','LEN','JIM',
     'PETER','ERIC','STAN','BILL','EDDY','JOE','RALPH','CLIFF','GEORGE','NORMAN',
     'FRED','SAM','ALAN','RON','VIC','DOUG','WILL','HUGH','KEN','RAY','LES','DAVE']:
    ['JAX','ACE','PIP','ROOK','NASH','HOLT','DEX','BECK','MILO','TUCK',
     'JUNO','KNOX','MACK','KIP','WREN','COLE','REX','DALE','VEX','LOU','BUCK','FINN',
     'KAZ','BEAU','SKIP','ASH','OZ','JEM','KIT','DOC','FOX','DASH','STAN','ZEKE'];
  let career={nextMission:1,nextId:0,active:[],fallen:[],victories:[],bestScore:0};
  let afterAction={mission:1,fallen:[],promotions:[],newRecruits:[],score:0};
  let missionLossStart=0,archiveScroll=0,archiveFinger=null;
  // The automatic ceremony shows ONLY casualties from the latest operation.
  // The camp Memorial keeps the complete, permanent roll of honour.
  let memorialOffset=-48,memorialFinger=null,memorialHoldUntil=0;
  let memorialReturn='title',memorialOperation=1,memorialRecent=[],memorialAutomatic=false,memorialMissionOnly=false;
  let memorialButton={x:0,y:0,w:0,h:0},memorialWindow={x:0,y:0,w:0,h:0};
  const ww2ByNumber=n=>NORWAY?.byNumber(n)||DUNKIRK?.byNumber(n)||null;
  const isDunkirk=()=>IS_WW2&&missionIndex>=7;
  const operationName=n=>IS_WW2?(ww2ByNumber(n)?.title.toUpperCase()||'AWAITING ORDERS'):
    n===1?'JUNGLE ASSAULT':n===2?'DEPOT RAID':n===3?'RADAR BLACKOUT':'AWAITING ORDERS';
  // Unrelated jungle saves, missions and assets continue on their original paths.
  let norwayLayout=null,norwayTargets=[],norwayCheckpoint=0,norwayConvoy=null;
  let norwayRescued=false,norwayHold=0,norwayHoldStarted=false,norwayWaves=0;
  let norwayWaveLimit=4,norwayFailure='',norwayEvent='';
  // French theatre phase state. Uses the same permanent WWII career/save key.
  let dunkirkRallies=0,dunkirkBarrierHp=100,dunkirkBridgeHp=100;
  let dunkirkColumns=0,dunkirkPhase='approach';
  // A small settings key that survives a native WebView restart.
  try {audioOn=localStorage.getItem('green-dawn-audio-v2')!=='off';}catch(_){}
  let seed=1;
  const rng=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
  const rnd=(a,b)=>a+rng()*(b-a),rand=(a,b)=>a+Math.random()*(b-a);
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const dist=(x,y,a,b)=>Math.hypot(x-a,y-b);
  const pointDist=(p,q)=>dist(p.x,p.y,q.x,q.y);
  const isMobile=()=>('ontouchstart' in window)||(navigator.maxTouchPoints>0);
  let pathLine=[{x:92,y:590},{x:227,y:539},{x:355,y:443},{x:498,y:359},{x:601,y:331},{x:718,y:284},{x:820,y:209},{x:883,y:143}];

  function addRecruits(count){
    const added=[];
    for(let i=0;i<count;i++){
      const n=career.nextId++;
      const member={id:'r'+n,name:RECRUIT_NAMES[n]||'TROOPER '+(n+1),rank:0,missions:0,joinedMission:career.nextMission,order:n};
      career.active.push(member);added.push(member);
    }
    return added;
  }
  function writeCareer(){
    try{localStorage.setItem(CAREER_KEY,JSON.stringify(career));}catch(_){/* offline storage unavailable */}
  }
  function loadSave(){
    try{
      const data=JSON.parse(localStorage.getItem(CAREER_KEY)||'null');
      if(data && Array.isArray(data.active) && Array.isArray(data.fallen) &&
         Array.isArray(data.victories) && Number.isInteger(data.nextMission) &&
         data.nextMission>=1 && Number.isInteger(data.nextId) && data.nextId>=3){
        career={...career,...data};
        // Never trust a historical menu-selection save to skip operations.
        const completed=new Set(career.victories.map(v=>v.mission));
        career.nextMission=1;
        while(career.nextMission<=CAMPAIGN_MISSIONS&&completed.has(career.nextMission))career.nextMission++;
        career.active=career.active.filter(m=>m&&typeof m.name==='string'&&
          !career.fallen.some(f=>f.id===m.id));
        return;
      }
    }catch(_){/* malformed or missing save; create fresh recruits */}
    addRecruits(3);writeCareer();
  }
  function rankName(r){return RANKS[clamp(r||0,0,RANKS.length-1)];}
  function shortRank(r){return SHORT_RANKS[clamp(r||0,0,SHORT_RANKS.length-1)];}
  function sortedPersonnel(){return [...career.active].sort((a,b)=>b.rank-a.rank||a.order-b.order);}
  function deployment(){return sortedPersonnel().slice(0,MAX_DEPLOY);}
  function ensureDeployment(){
    if(!career.active.length){
      // A total wipeout must not make the campaign impossible to continue.
      addRecruits(3);writeCareer();
    }
    return deployment();
  }
  function enterMemorial(auto=false,returnTo='title',missionOnly=auto){
    cancelGesture();archiveFinger=null;memorialFinger=null;
    memorialOffset=-48;memorialHoldUntil=0;
    memorialAutomatic=auto;
    memorialMissionOnly=missionOnly;
    memorialReturn=returnTo;
    memorialOperation=missionOnly?missionIndex:Math.max(1,Math.min(CAMPAIGN_MISSIONS,career.nextMission-1));
    memorialRecent=missionOnly?afterAction.fallen.map(s=>s.id):[];
    state=auto?'honours':'memorial';
  }
  function memorialEntries(){
    if(!memorialMissionOnly)return career.fallen;
    // Compare both ID and operation: no historical names on a mission ceremony.
    const currentIds=new Set(memorialRecent);
    return career.fallen.filter(f=>f.mission===memorialOperation&&currentIds.has(f.id));
  }
  function startAfterAction(result){
    afterAction.score=score;
    career.pendingHonours={operation:missionIndex,result,
      fallen:afterAction.fallen.map(f=>f.id),score};
    writeCareer();
    enterMemorial(true,result);
  }
  function leaveMemorial(){
    memorialFinger=null;memorialHoldUntil=0;
    const from=state;
    if(from==='honours'){
      // Dismiss the once-per-mission ceremony. Historical names stay forever.
      career.pendingHonours=null;writeCareer();
    }
    state=memorialReturn||'title';
    memorialAutomatic=false;
  }
  function recordCasualty(s){
    if(!s.careerId || career.fallen.some(f=>f.id===s.careerId))return;
    const idx=career.active.findIndex(m=>m.id===s.careerId);
    if(idx<0)return;
    const member=career.active.splice(idx,1)[0];
    const entry={id:member.id,name:member.name,rank:member.rank,missions:member.missions,
      mission:missionIndex,cause:'KILLED IN ACTION'};
    career.fallen.push(entry);
    afterAction.fallen.push(entry);
    writeCareer(); // permanent even if the game closes mid-mission
  }
  function completeCareerMission(){
    const completed=career.victories.some(v=>v.mission===missionIndex);
    if(completed)return; // no double promotions or recruit awards
    const promotions=[];
    for(const s of soldiers){
      if(!s.alive)continue;
      const member=career.active.find(m=>m.id===s.careerId);
      if(!member)continue;
      const previous=member.rank;
      member.rank=Math.min(member.rank+1,RANKS.length-1);
      member.missions=(member.missions||0)+1;
      s.rank=member.rank;
      promotions.push({name:member.name,from:previous,to:member.rank});
    }
    career.bestScore=Math.max(career.bestScore,score);
    career.victories.push({mission:missionIndex,score,survivors:soldiers.filter(s=>s.alive).length,
      casualties:afterAction.fallen.length});
    career.nextMission=missionIndex+1;
    const added=addRecruits(RECRUITS_PER_VICTORY);
    afterAction.promotions=promotions;
    afterAction.newRecruits=added.map(m=>m.name);
    afterAction.score=score;
    writeCareer();
  }

  function resize(){
    const ratio=window.innerWidth/window.innerHeight;
    W=Math.round(WH*clamp(ratio,1.75,2.35));VW=W-HUD;
    canvas.width=W;canvas.height=WH;
    ctx.imageSmoothingEnabled=false;
    if(state==='playing') clampCamera();
  }
  const riverX=(y)=>602+20*Math.sin(y*.012)+7*Math.sin(y*.043);
  const onBridge=(x,y)=>y>=310&&y<=349&&Math.abs(x-riverX(y))<77;
  const inRiver=(x,y)=>Math.abs(x-riverX(y))<31;
  function lineDistance(x,y,route){
    let best=Infinity;
    for(let i=0;i<route.length-1;i++){
      const a=route[i],b=route[i+1];const dx=b.x-a.x,dy=b.y-a.y;
      const t=clamp(((x-a.x)*dx+(y-a.y)*dy)/(dx*dx+dy*dy),0,1);
      best=Math.min(best,dist(x,y,a.x+t*dx,a.y+t*dy));
    }
    return best;
  }

  function prepareNorwayMission(){
    if(!IS_WW2)return;
    norwayLayout=ww2ByNumber(missionIndex);
    if(!norwayLayout)throw Error('Unimplemented WWII mission '+missionIndex);
    const specs=norwayLayout.targets||[];
    norwayTargets=specs.map(([x,y,w,h,hp,label],i)=>({
      x,y,w,h,hp,maxHp:hp,dead:false,
      kind:missionIndex===5?'signals':missionIndex===10?'armour':
        missionIndex===12?'pillbox':'coastal',label,id:i
    }));
    if(missionIndex===1){
      bunker={x:871,y:119,w:67,h:53,hp:8,maxHp:8,dead:false,kind:'coastal'};
      norwayTargets=[bunker];
    }else{
      bunker=norwayTargets[0]||{x:-120,y:-120,w:1,h:1,hp:0,maxHp:0,dead:true,kind:'none'};
    }
    const loc=norwayLayout?.extraction;
    extraction=loc?{x:loc[0],y:loc[1],r:26}:{x:797,y:219,r:27};
    norwayCheckpoint=0;norwayRescued=false;norwayHold=0;
    norwayHoldStarted=false;norwayWaves=0;norwayFailure='';norwayEvent='';
    norwayWaveLimit=missionIndex===12?
      (career.victories.some(v=>v.mission===10&&v.casualties===0)?4:5):
      (career.victories.some(v=>v.mission===4&&v.casualties===0)?3:4);
    dunkirkRallies=0;dunkirkBarrierHp=100;dunkirkBridgeHp=100;
    dunkirkColumns=0;dunkirkPhase='approach';
    norwayConvoy=(missionIndex===3||missionIndex===11)?{
      x:norwayLayout.convoy[0][0],y:norwayLayout.convoy[0][1],
      waypoints:norwayLayout.convoy.map(p=>({x:p[0],y:p[1]})),
      index:1,health:missionIndex===11?130:100,
      maxHealth:missionIndex===11?130:100,ambushes:0,delivered:false
    }:null;
  }
  function drawNorwayTerrain(g){
    // All five maps have distinct landmarks yet retain familiar Amiga-era pixels.
    if(missionIndex===2||missionIndex===3){
      // Wind-cut cliffs, snow slabs, and mountain shadows around the pass.
      for(let i=0;i<135;i++){
        const x=(rng()*MW)|0,y=(rng()*MH)|0,w=9+(rng()*36)|0;
        if(lineDistance(x,y,pathLine)<60||inRiver(x,y))continue;
        g.fillStyle=i%3===0?'#e8eded':i%3===1?'#617b86':'#718891';
        g.fillRect(x,y,w,3+i%6);
        g.fillStyle='#d0e0df';g.fillRect(x+4,y-3,Math.max(3,w-10),2);
      }
      if(missionIndex===3){
        for(let i=0;i<120;i++){
          const x=(rng()*MW)|0,y=(rng()*MH)|0;
          g.fillStyle='#e9f1ec';g.fillRect(x,y,3+(i%5),1);
        }
      }
    }
    if(missionIndex===4){
      // North fjord: sea, distant rocks and concrete artillery positions.
      for(let x=8;x<MW-9;x+=13){
        const coast=36+Math.sin(x*.022)*8;
        g.fillStyle='#315961';g.fillRect(x,7,13,Math.max(2,coast-7));
        g.fillStyle='#9dc2bb';g.fillRect(x,coast,13,2);
        if(x%4)g.fillStyle='#83a8a7',g.fillRect(x+2,14,5,1);
      }
    }
    if(missionIndex===5||missionIndex===6){
      // Narvik shoreline and piers; shallow water lies off the combat route.
      g.fillStyle='#3c646a';g.fillRect(6,6,217,77);
      for(let i=0;i<15;i++){
        g.fillStyle=i%2?'#638e96':'#87ada9';
        g.fillRect(13+i*14,22+i%4*10,16,2);
      }
      g.fillStyle='#536c69';g.fillRect(37,75,132,22);
      for(let i=0;i<13;i++){
        g.fillStyle=i%2?'#b3ad94':'#817e68';g.fillRect(42+i*10,77,9,19);
      }
      g.fillStyle='#3d5152';g.fillRect(42,99,10,31);g.fillRect(151,99,10,31);
      // Corrugated storehouses, mooring posts and coiled ropes.
      for(const [x,y] of [[31,185],[335,65],[679,185]]){
        if(lineDistance(x,y,pathLine)<48)continue;
        g.fillStyle='#556a66';g.fillRect(x,y,45,23);
        g.fillStyle='#8ca29d';g.fillRect(x+3,y+3,39,3);
        g.fillStyle='#a9b7ad';g.fillRect(x+7,y+9,5,12);
      }
      if(missionIndex===6){
        for(let i=0;i<30;i++){
          const x=(i*79+47)%MW,y=(i*113+29)%MH;
          if(lineDistance(x,y,pathLine)<45)continue;
          g.fillStyle=i%2?'#596567':'#a0aca5';g.fillRect(x,y,8+i%7,4+i%5);
        }
      }
    }
  }
  function drawDunkirkTerrain(g){
    // A distinct 1940 French world: farmland, fields, hedges, village streets and coast.
    // All hard-object placements stay away from the navigable mission route.
    const beach=missionIndex===12;
    if(beach){
      // Channel water in the north-west, with wet sand and short breakers.
      g.fillStyle='#345662';g.fillRect(6,6,238,84);
      g.fillStyle='#63828b';g.fillRect(7,68,250,17);
      g.fillStyle='#c3b38e';g.fillRect(6,84,235,13);
      for(let i=0;i<18;i++){
        const x=14+i*13,y=19+i%5*12;
        g.fillStyle=i%2?'#83a9ae':'#b3c3b7';g.fillRect(x,y,11,2);
      }
      // Dunkirk beach obstacles and piles of abandoned kit.
      for(const [x,y] of [[32,111],[81,133],[98,202],[243,84]]){
        if(lineDistance(x,y,pathLine)<42)continue;
        g.fillStyle='#4b554b';g.fillRect(x-11,y,21,3);g.fillRect(x-2,y-9,4,23);
        g.fillStyle='#a59c81';g.fillRect(x-7,y-5,14,3);
      }
    }
    const patches=missionIndex===9?56:missionIndex===10?28:90;
    for(let i=0;i<patches;i++){
      const x=(rng()*MW)|0,y=(rng()*MH)|0,w=19+(rng()*57)|0,h=12+(rng()*36)|0;
      if(lineDistance(x,y,pathLine)<56||Math.abs(x-riverX(y))<58||
         x+w>=MW-7||y+h>=MH-7)continue;
      g.fillStyle=['#697958','#849370','#8d8b64','#727453','#586953'][i%5];
      g.fillRect(x,y,w,h);
      for(let j=4;j<h-2;j+=7){
        g.fillStyle=i%2?'#a3a07a':'#8d9b6f';g.fillRect(x+3,y+j,w-7,2);
      }
      if(i%4===0){
        // Low square French hedgerows; shallow shadows on the lower edge.
        g.fillStyle='#334f36';g.fillRect(x,y+h-4,w,5);
        g.fillStyle='#66835b';g.fillRect(x+3,y+h-5,w-6,2);
      }
    }
    if(missionIndex===7||missionIndex===8||missionIndex===10){
      const buildings=missionIndex===10?
        [[55,196,70,47],[347,109,60,42],[676,110,67,51],[704,540,57,44]]:
        [[66,146,72,52],[354,90,58,44],[742,125,59,45],[821,539,66,46]];
      for(const [x,y,w,h] of buildings){
        if(lineDistance(x+w/2,y+h/2,pathLine)<64)continue;
        g.fillStyle='#3f5148';g.fillRect(x-5,y+h,w+9,9);
        g.fillStyle='#a8a18b';g.fillRect(x,y,w,h);
        g.fillStyle=missionIndex===10?'#684b3d':'#8b6348';g.fillRect(x-3,y-7,w+6,16);
        for(let i=0;i<3;i++){
          g.fillStyle='#b98462';g.fillRect(x+8+i*21,y-4,13,3);
        }
        for(const wx of [x+10,x+w-22]){
          g.fillStyle='#465956';g.fillRect(wx,y+25,10,11);
          g.fillStyle='#a9c4bd';g.fillRect(wx+2,y+27,6,7);
        }
        g.fillStyle='#5b5847';g.fillRect(x+w/2-5,y+h-20,13,20);
        if(missionIndex===10){
          // Damaged masonry and smoke-dark roof tiles.
          g.fillStyle='#3b443e';g.fillRect(x+23,y-7,15,6);

      const x=id%COLS,y=Math.floor(id/COLS);
      for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
        if(!ox&&!oy)continue;
        const xx=x+ox,yy=y+oy;
        if(xx<0||yy<0||xx>=COLS||yy>=ROWS)continue;
        const n=navId(xx,yy);
        if(!mapData[n]||closed[n])continue;
        if(ox&&oy&&(!mapData[navId(x+ox,y)]||!mapData[navId(x,y+oy)]))continue;
        const step=ox&&oy?1.4142:1,scoreSoFar=g[id]+step;
        if(scoreSoFar<g[n]){
          came[n]=id;g[n]=scoreSoFar;
          const h=Math.hypot(goal.x-xx,goal.y-yy);
          open.push({id:n,f:scoreSoFar+h});
        }
      }
    }
    if(!found)return [];
    const result=[];let node=goalId;
    while(node!==-1&&node!==startId&&result.length<400){
      result.push({x:(node%COLS)*CELL+8,y:Math.floor(node/COLS)*CELL+8});node=came[node];
    }
    result.reverse();
    // Remove unnecessary grid corners while sampling every intervening step.
    // This gives soldiers smooth, direct movement without allowing them to
    // shortcut across a river or cut through the trees beside the bridge.
    const clearSegment=(a,b)=>{
      const d=pointDist(a,b),samples=Math.max(1,Math.ceil(d));
      for(let k=1;k<=samples;k++){
        const t=k/samples;
        if(blocked(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t,4))return false;
      }
      return true;
    };
    const smooth=[];
    let origin={x:ax,y:ay},i=0;
    while(i<result.length){
      let last=i;
      for(let k=result.length-1;k>i;k--){if(clearSegment(origin,result[k])){last=k;break;}}
      smooth.push(result[last]);origin=result[last];i=last+1;
    }
    return smooth;
  }

  // Each squad follows one leader. The leader records an actual ground trail

  function startFootsteps(s){

  }
  function recordFootsteps(s){
    if(!s.trail||!s.trail.length)startFootsteps(s);
    const last=s.trail[s.trail.length-1],walked=dist(s.x,s.y,last.x,last.y);
    if(walked<TRAIL_STEP)return;
    s.trailWalked+=walked;
    s.trail.push({x:s.x,y:s.y,walked:s.trailWalked});
    if(s.trail.length>TRAIL_LIMIT)s.trail.shift();

  function footstepBehind(leader,gap){
    const trail=leader.trail;
    if(!trail||!trail.length)return {x:leader.x,y:leader.y};
    const target=Math.max(0,(leader.trailWalked||0)-gap);
    if(target<=trail[0].walked){
      // The leader has not yet walked far enough to leave a complete trail.
      // Place followers *behind* the starting point, rather than piling
      // every soldier onto that point when the leader stops to regroup.
      const remaining=Math.max(0,gap-(leader.trailWalked||0));
      const origin=trail[0];
      const heading=trail.length>1?
        Math.atan2(trail[1].y-origin.y,trail[1].x-origin.x):leader.face||0;
      for(const turn of [0,.65,-.65,1.3,-1.3,Math.PI]){
        const angle=heading+turn;
        const candidate={x:origin.x-Math.cos(angle)*remaining,
          y:origin.y-Math.sin(angle)*remaining};
        if(candidate.x<12||candidate.y<12||candidate.x>MW-12||candidate.y>MH-12)continue;
        if(!blocked(candidate.x,candidate.y,4)&&walkClear(origin,candidate))return candidate;
      }
      return origin;
    }
    for(let i=trail.length-1;i>0;i--){
      const b=trail[i],a=trail[i-1];
      if(a.walked<=target){
        const portion=clamp((target-a.walked)/Math.max(.001,b.walked-a.walked),0,1);
        return {x:a.x+(b.x-a.x)*portion,y:a.y+(b.y-a.y)*portion};
      }
    }

  }
  function walkClear(a,b){
    const steps=Math.max(1,Math.ceil(pointDist(a,b)/3));
    for(let i=1;i<=steps;i++){

  function assignFollower(s,leader,rank){

  function detachFromLeader(s,keepDestination=false){
    if(s.followId===null||s.followId===undefined)return;
    const leader=soldiers[s.followId];
    // On split, the other squad keeps marching toward the former command.
    const oldEnd=leader&&leader.path.length?leader.path[leader.path.length-1]:s.followGoal;
    s.followId=null;s.followGoal=null;s.followTimer=0;s.followGap=0;
    s.path=keepDestination&&oldEnd?pathfind(s.x,s.y,oldEnd.x,oldEnd.y):[];

  function releaseFollowersOf(leader){

  function moveSquad(x,y,leaderOverride=null){
    const live=currentSoldiers();if(!live.length)return;
    const leader=live.find(s=>s.id===leaderOverride)||live[0];
    // An individually controlled leader must not drag a different team along.
    for(const s of soldiers)if(s.alive&&s.followId===leader.id&&!live.includes(s))detachFromLeader(s,true);
    for(const s of live)detachFromLeader(s,false);
    const goal={x:clamp(x,18,MW-18),y:clamp(y,18,MH-18)};
    leader.path=pathfind(leader.x,leader.y,goal.x,goal.y);

  function moveOneSoldier(s,dt,speed=DIFFICULTY.moveSpeed){
    // Skip reached waypoints without wasting a whole frame on each corner.
    while(s.path.length&&dist(s.x,s.y,s.path[0].x,s.path[0].y)<3)s.path.shift();
    if(!s.path.length)return;
    const p=s.path[0],dx=p.x-s.x,dy=p.y-s.y,len=Math.hypot(dx,dy);
    if(len<.001){s.path.shift();return;}
    const step=Math.min(len,speed*dt);
    s.face=Math.atan2(dy,dx);
    const nx=s.x+dx/len*step,ny=s.y+dy/len*step;
    if(!blocked(nx,ny,4)){s.x=nx;s.y=ny;}

  function advanceFormation(dt){
    // First move leaders; followers then follow their leaders' current trail.
    for(const s of soldiers){
      if(!s.alive||(s.followId!==null&&s.followId!==undefined))continue;
      moveOneSoldier(s,dt);recordFootsteps(s);
    }
    for(const s of soldiers){
      if(!s.alive||s.followId===null||s.followId===undefined)continue;
      const leader=soldiers[s.followId];
      if(!leader||!leader.alive){detachFromLeader(s,false);continue;}
      const goal=footstepBehind(leader,s.followGap);
      const distanceToGoal=dist(s.x,s.y,goal.x,goal.y);
      s.followTimer=(s.followTimer||0)-dt;
      if(distanceToGoal<4){s.path=[];s.followGoal=goal;continue;}
      const changed=!s.followGoal||pointDist(s.followGoal,goal)>5;
      if(s.followTimer<=0&&(changed||!s.path.length)){
        s.path=walkClear(s,goal)?[{x:goal.x,y:goal.y}]:pathfind(s.x,s.y,goal.x,goal.y);
        s.followGoal={x:goal.x,y:goal.y};

  function killSoldier(s){

  function enemyMove(e,x,y,dt,speed){
    const dx=x-e.x,dy=y-e.y,d=Math.hypot(dx,dy);
    if(d<3)return true;
    const step=Math.min(d,dt*speed),nx=e.x+dx/d*step,ny=e.y+dy/d*step;
    e.dir=Math.atan2(dy,dx);
    if(blocked(nx,ny,4))return false;
    e.x=nx;e.y=ny;return true;
  }
  function enemyFollowPath(e,path,dt,speed){
    while(path.length&&dist(e.x,e.y,path[0].x,path[0].y)<5)path.shift();
    if(!path.length)return false;
    if(!enemyMove(e,path[0].x,path[0].y,dt,speed))path.shift();
    return path.length>0;
  }
  function enemyFindCover(e,target){
    // Search nearby tree trunks, choosing a reachable point on their far side
    // relative to the visible soldier. This gives genuine, shootable cover.
    let best=null,bestCost=Infinity;
    for(const t of trees){
      const near=dist(e.x,e.y,t.x,t.y);
      if(near>ENEMY_AI.coverRadius)continue;
      const fromThreat=dist(t.x,t.y,target.x,target.y)||1;
      const safe={x:t.x+(t.x-target.x)/fromThreat*(t.r*.72+12),
        y:t.y+(t.y-target.y)/fromThreat*(t.r*.72+12)};
      if(blocked(safe.x,safe.y,4))continue;
      if(clearShot(target,safe))continue;
      const cost=near+dist(e.x,e.y,safe.x,safe.y)*.65;
      if(cost<bestCost){bestCost=cost;best=safe;}
    }
    if(!best){e.coverCooldown=1.8;return false;}
    const path=pathfind(e.x,e.y,best.x,best.y);
    if(!path.length){e.coverCooldown=1.8;return false;}
    e.coverPath=path;e.coverTime=3.5;e.coverCooldown=6.0;
    e.investigatePath=[];return true;
  }
  function updateEnemies(dt,live){
    for(const e of enemies){
      if(!e.alive)continue;
      e.wander-=dt;e.fire-=dt;e.alert=Math.max(0,e.alert-dt);
      e.suppressed=Math.max(0,e.suppressed-dt);
      e.coverTime=Math.max(0,e.coverTime-dt);
      e.coverCooldown=Math.max(0,e.coverCooldown-dt);
      e.investigateTimer=Math.max(0,e.investigateTimer-dt);
      const visible=live.filter(s=>dist(e.x,e.y,s.x,s.y)<DIFFICULTY.enemySight&&clearShot(e,s));
      let target=null,nearest=Infinity;
      for(const s of visible){const d=pointDist(e,s);if(d<nearest){target=s;nearest=d;}}
      e.seen=!!target;
      if(target){
        e.lastKnown={x:target.x,y:target.y};e.alert=ENEMY_AI.alertDuration;
        e.aimTime=Math.min(1,e.aimTime+dt);
      }else e.aimTime=0;
      if(e.suppressed>.35&&e.coverCooldown<=0&&target)enemyFindCover(e,target);
      if(e.coverPath.length){
        e.tactic='seeking cover';
        const finalCover=e.coverPath[e.coverPath.length-1];
        const moving=enemyFollowPath(e,e.coverPath,dt,29);
        if(!moving){
          // Only crouch behind cover if the guard actually reached that cover.
          if(dist(e.x,e.y,finalCover.x,finalCover.y)<13)e.coverTime=Math.max(e.coverTime,1.4);
          else e.coverTime=0;
        }
        continue; // no accurate fire while running to cover
      }
      if(e.coverTime>0){
        e.tactic='in cover';
      } else if(target){
        e.tactic='engaging';
        e.dir=Math.atan2(target.y-e.y,target.x-e.x);
        // Advance deliberately instead of rushing into the player's squad.
        if(nearest>103)enemyMove(e,target.x,target.y,dt,13);
      } else if(e.alert>0&&e.lastKnown){
        e.tactic='investigating';
        if(dist(e.x,e.y,e.lastKnown.x,e.lastKnown.y)>27){
          if(e.investigateTimer===0){
            e.investigatePath=pathfind(e.x,e.y,e.lastKnown.x,e.lastKnown.y);
            e.investigateTimer=2;
          }
          if(!e.investigatePath.length||!enemyFollowPath(e,e.investigatePath,dt,19)){
            enemyMove(e,e.lastKnown.x,e.lastKnown.y,dt,12);
          }
        }
      }else{
        e.tactic='patrol';
        if(e.wander<=0){e.patrolX=e.homeX+rand(-34,34);e.patrolY=e.homeY+rand(-27,27);e.wander=rand(1.8,4.3);}
        if(dist(e.x,e.y,e.patrolX,e.patrolY)>4){
          if(!enemyMove(e,e.patrolX,e.patrolY,dt,17))e.wander=0;
        }
      }
      if(target&&e.aimTime>.35&&e.suppressed<.1&&e.fire<=0&&
        clearShot(e,target)){
        e.dir=Math.atan2(target.y-e.y,target.x-e.x);
        fireBullet({x:e.x+Math.cos(e.dir)*7,y:e.y+Math.sin(e.dir)*7},
          {x:target.x+rand(-7,7),y:target.y+rand(-7,7)},'enemy');
        e.fire=rand(DIFFICULTY.enemyFire,DIFFICULTY.enemyFire+.9);
        sound('enemy');
      }
    }
  }
  function update(dt){
    clock+=dt;if(messageTime>0)messageTime-=dt;if(panHint>0)panHint-=dt;
    advanceFormation(dt);
    const live=soldiers.filter(s=>s.alive);
    updateEnemies(dt,live);
    if((gesture&&gesture.firing)||clock<fireUntil){
      for(const s of currentSoldiers()){
        s.fire-=dt;
        if(s.fire<=0){
          s.face=Math.atan2(aim.y-s.y,aim.x-s.x);
          fireBullet({x:s.x+Math.cos(s.face)*9,y:s.y+Math.sin(s.face)*9},aim,'player');
          s.fire=DIFFICULTY.gunRate+rand(0,.055);
          if(Math.random()<.45)sound('gun');
        }
      }
    } else for(const s of soldiers)s.fire=Math.max(0,s.fire-dt);
    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i],x0=b.x,y0=b.y; b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
      let impact=false;
      const steps=Math.max(1,Math.ceil(dist(x0,y0,b.x,b.y)/4));
      for(let j=1;j<=steps&&!impact;j++){
        const x=x0+(b.x-x0)*j/steps,y=y0+(b.y-y0)*j/steps;
        if(x<4||y<4||x>MW-4||y>MH-4){impact=true;break;}
        if(b.owner==='player'){
          for(const e of enemies){
            if(!e.alive)continue;
            const near=dist(x,y,e.x,e.y);
            if(near<7){killEnemy(e);impact=true;break;}
            if(near<ENEMY_AI.suppressionRadius&&e.suppressed<.12){
              e.suppressed=.85;e.alert=ENEMY_AI.alertDuration;
              e.lastKnown={x:b.x-b.vx*.15,y:b.y-b.vy*.15};
              addParticles(e.x,e.y,'#e6c778',2,15,'spark');
            }
          }
          if(!impact)for(const target of IS_WW2?norwayTargets:[bunker]){
            if(target.dead||x<target.x||x>target.x+target.w||
               y<target.y||y>target.y+target.h)continue;
            target.hp=Math.max(0,target.hp-.13);impact=true;
            effect(x,y,'impact');addParticles(x,y,'#e6ca73',4,22,'spark');
            checkBunker(target);break;
          }
        }else{
          for(const s of soldiers){if(s.alive&&dist(x,y,s.x,s.y)<5.3){killSoldier(s);impact=true;break;}}
        }
        if(!impact&&shotBlocked(x,y)){
          impact=true;effect(x,y,'impact');
          if(Math.random()<.65)addParticles(x,y,'#b8a579',3,19,'spark');
        }
        if(impact&&Math.random()<.18)decals.push({x,y,color:'#6a5938',life:7,r:2});
      }
      if(impact||b.life<=0)bullets.splice(i,1);
    }
    for(let i=bombs.length-1;i>=0;i--){
      const b=bombs[i];b.t+=dt;const k=clamp(b.t/b.total,0,1);
      b.x=b.fromX+(b.toX-b.fromX)*k;b.y=b.fromY+(b.toY-b.fromY)*k;
      if(b.t>=b.total){explode(b.toX,b.toY);bombs.splice(i,1);}
    }
    if(!ammo.taken&&live.some(s=>dist(s.x,s.y,ammo.x,ammo.y)<17)){
      ammo.taken=true;grenades=Math.min(6,grenades+2);score+=50;flash('AMMO SUPPLY: +2 GRENADES',2.5);sound('pickup');
      addParticles(ammo.x,ammo.y,'#ffd76a',17,30,'spark');
    }
    for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;
      p.vx*=1-2*dt;p.vy*=1-2*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1);
    }
    for(let i=decals.length-1;i>=0;i--){decals[i].life-=dt;if(decals[i].life<=0)decals.splice(i,1);}
    for(let i=gunEffects.length-1;i>=0;i--){gunEffects[i].life-=dt;if(gunEffects[i].life<=0)gunEffects.splice(i,1);}
    for(let i=fallenBodies.length-1;i>=0;i--){fallenBodies[i].life-=dt;if(fallenBodies[i].life<=0)fallenBodies.splice(i,1);}
    if(state==='playing'&&IS_WW2)updateNorway(dt);
    else if(state==='playing'&&missionIndex>1&&bunker.dead&&
       soldiers.some(s=>s.alive&&dist(s.x,s.y,extraction.x,extraction.y)<extraction.r)){
      finishMission();
    }
    followCamera(dt);
  }
  function clampCamera(){cam.x=clamp(cam.x,0,Math.max(0,MW-VW));cam.y=clamp(cam.y,0,MH-VH);}
  function followCamera(dt){
    let focus=currentSoldiers();if(!focus.length)focus=soldiers.filter(s=>s.alive);
    if(focus.length){
      const lead=focus.find(s=>s.followId===null||s.followId===undefined)||focus[0];
      const tx=lead.x-VW*.41,ty=lead.y-VH*.56;
      const speed=1-Math.exp(-dt*4.9);
      cam.x+=(tx-cam.x)*speed;cam.y+=(ty-cam.y)*speed;
    }
    clampCamera();
  }

  function buttons(){

    const a=Math.floor(remaining*.265),b=Math.floor(remaining*.32),c=Math.floor(remaining*.22),d=remaining-a-b-c;
    const x=HUD+p+prompt+gap,y=CTRL_Y+3;
    const list=[
      {name:split?'JOIN':'SPLIT',mode:'split',x,w:a},
      {name:mode==='grenade'?'CANCEL FRAG':'FRAG '+grenades,mode:'grenade',x:x+a+gap,w:b},
      {name:audioOn?'SFX ON':'SFX OFF',mode:'sound',x:x+a+b+gap*2,w:c},
      {name:'PAUSE',mode:'pause',x:x+a+b+c+gap*3,w:d}

    for(const el of list)button(el.x,y,el.w,31,el.name,el.mode,el.mode==='split'?split:el.mode===mode);

  function drawRankChevron(cx,y,color){
    for(let step=0;step<5;step++){
      const yy=y+8-step*2;
      const lx=cx-10+step*2,rx=cx+8-step*2;
      rect(lx+1,yy+1,3,3,'#1e2a20');

      rect(lx,yy,3,2,color);
      rect(rx,yy,3,2,color);

  function drawRankInsignia(rank,x,y){
    const r=clamp(Number(rank)||0,0,RANKS.length-1),gold='#efc768';
    rect(x,y,31,31,'#324331');
    rect(x+2,y+2,27,27,'#46573d');
    stroke(x,y,31,31,'#927749');
    rect(x+3,y+3,3,3,'#627451');
    rect(x+25,y+24,3,3,'#627451');
    const cx=x+15;
    if(r===0){
      // Recruits have an unadorned field mark.
      rect(cx-3,y+12,7,7,gold);
      rect(cx-1,y+10,3,11,'#f5db95');
    }else if(r<=5){
      const count=Math.min(3,r),top=r>=4?0:count===1?10:count===2?6:1;
      const gap=r>=4?7:9;
      for(let i=0;i<count;i++)drawRankChevron(cx,y+top+i*gap,gold);
      if(r>=4)rect(x+9,y+25,13,2,gold);
      if(r===5)rect(x+11,y+28,9,2,gold);
    }else if(r===6){
      // Warrant officer: pixelated diamond.
      rect(cx-2,y+5,5,4,gold);
      rect(cx-6,y+9,13,4,gold);
      rect(cx-10,y+13,21,4,gold);
      rect(cx-6,y+17,13,4,gold);
      rect(cx-2,y+21,5,4,gold);
    }else if(r===7||r===8){
      // Commissioned officers: one or two gold bars.
      for(const bx of (r===7?[cx-3]:[cx-9,cx+4])){
        rect(bx,y+7,6,19,'#ae853b');
        rect(bx+1,y+8,4,17,gold);
      }
    }else if(r===9){
      // Major: a small pixel star.
      rect(cx-1,y+5,3,7,gold);
      rect(cx-8,y+11,17,4,gold);
      rect(cx-5,y+15,11,4,gold);
      rect(cx-3,y+19,7,4,gold);
      rect(cx-6,y+23,3,4,gold);
      rect(cx+4,y+23,3,4,gold);
    }else{
      // Colonel: paired pixel stars.
      for(const sx of [x+9,x+22]){
        rect(sx-1,y+7,3,17,gold);
        rect(sx-5,y+12,11,4,gold);
        rect(sx-3,y+17,7,4,gold);

  function exportBackup(){
    if(state!=='backup')return;

      payload=backupPayload();
      if(payload.length>BACKUP_MAX_CHARS)throw Error('SAVE TOO LARGE');
    }catch(_){backupStatus='COULD NOT PREPARE BACKUP';return;}
    if(window.GreenDawnAndroid&&typeof window.GreenDawnAndroid.exportSave==='function'){
      try {
        window.GreenDawnAndroid.exportSave(payload);
        backupStatus='CHOOSE WHERE TO SAVE THE FILE';
      }catch(_){backupStatus='COULD NOT OPEN ANDROID FILES';}
      return;
    }
    // Non-Android browser fallback. The APK always uses Android's file picker.
    try {
      const blob=new Blob([payload],{type:'application/json'});
      const url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download='GreenDawn-campaign-backup.json';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1200);
      backupStatus='BACKUP DOWNLOAD REQUESTED';
    }catch(_){backupStatus='EXPORT UNAVAILABLE IN THIS BROWSER';}
  }
  function importBackup(){
    if(state!=='backup')return;

    if(window.GreenDawnAndroid&&typeof window.GreenDawnAndroid.importSave==='function'){
      try {
        window.GreenDawnAndroid.importSave();
        backupStatus='CHOOSE YOUR GREEN DAWN JSON FILE';
      }catch(_){backupStatus='COULD NOT OPEN ANDROID FILES';}
      return;
    }
    try {
      const picker=document.createElement('input');
      picker.type='file';picker.accept='.json,application/json';
      picker.addEventListener('change',async()=>{
        const file=picker.files&&picker.files[0];
        if(!file)return;
        if(file.size>BACKUP_MAX_CHARS*3){backupStatus='FILE IS TOO LARGE';return;}
        try{receiveBackup(await file.text());}
        catch(_){backupStatus='COULD NOT READ BACKUP FILE';}
      },{once:true});
      picker.click();
      backupStatus='CHOOSE YOUR GREEN DAWN JSON FILE';
    }catch(_){backupStatus='IMPORT UNAVAILABLE IN THIS BROWSER';}
  }
  function validateBackup(raw){
    if(typeof raw!=='string'||raw.length<30||raw.length>BACKUP_MAX_CHARS)
      throw Error('INVALID FILE SIZE');
    const file=JSON.parse(raw);
    if(!file||file.format!==BACKUP_FORMAT||file.version!==BACKUP_VERSION)
      throw Error('NOT A GREEN DAWN BACKUP');
    const data=file.career;
    if(!data||!Number.isInteger(data.nextId)||data.nextId<3||data.nextId>1000000||
       !Number.isInteger(data.nextMission)||data.nextMission<1||
       data.nextMission>CAMPAIGN_MISSIONS+1)
      throw Error('INVALID CAREER');
    if(!Array.isArray(data.active)||!Array.isArray(data.fallen)||
       !Array.isArray(data.victories)||data.active.length>2000||
       data.fallen.length>2000||data.victories.length>CAMPAIGN_MISSIONS)
      throw Error('INVALID ROSTER');
    const seen=new Set();
    for(const m of [...data.active,...data.fallen]){
      if(!m||typeof m.name!=='string'||!/^[A-Z0-9 -]{1,28}$/.test(m.name)||
         typeof m.id!=='string'||!/^r[0-9]+$/.test(m.id)||
         Number(m.id.slice(1))>=data.nextId||seen.has(m.id)||
         !Number.isInteger(m.rank)||m.rank<0||m.rank>=RANKS.length||
         !Number.isInteger(m.missions)||m.missions<0||m.missions>10000)
        throw Error('INVALID SOLDIER');
      if(data.fallen.includes(m)&&(!Number.isInteger(m.mission)||m.mission<1||
          m.mission>CAMPAIGN_MISSIONS))throw Error('INVALID CASUALTY');
      seen.add(m.id);
    }
    for(let i=0;i<data.victories.length;i++){
      const v=data.victories[i];
      if(!v||!Number.isInteger(v.mission)||v.mission!==i+1||
         !Number.isFinite(v.score)||v.score<0)
        throw Error('INVALID OPERATIONS');
    }
    if(data.pendingHonours!=null){
      const p=data.pendingHonours;
      if(!Number.isInteger(p.operation)||p.operation<1||
         p.operation>CAMPAIGN_MISSIONS||!Array.isArray(p.fallen)||
         p.fallen.length>2000||!['won','lost'].includes(p.result)||
         p.fallen.some(id=>!data.fallen.some(f=>f.id===id&&f.mission===p.operation)))
        throw Error('INVALID CEREMONY');
    }
    // Copy only known save fields so imported JSON cannot inject other state.
    return {
      career:{
        nextMission:data.nextMission,nextId:data.nextId,
        active:data.active.map(m=>({...m})),
        fallen:data.fallen.map(m=>({...m})),
        victories:data.victories.map(v=>({...v})),
        bestScore:Number.isFinite(data.bestScore)?Math.max(0,data.bestScore):0,
        ...(data.pendingHonours?{pendingHonours:{...data.pendingHonours}}:{})
      },
      audioOn:typeof file.settings?.audioOn==='boolean'?file.settings.audioOn:null
    };
  }

    button(archiveBack.x,archiveBack.y,archiveBack.w,archiveBack.h,'BACK TO CAMP','back',true);
  }
  function drawPause(){
    shade(.75);const x=HUD+VW/2;
    text('PAUSED',x,65,27,C.sand,'center');
    text('SQUAD HOLDING POSITION',x,105,10,C.cream,'center');
    const w=210;resultStart={x:x-w/2,y:149,w,h:43};
    button(resultStart.x,resultStart.y,w,43,'RESUME MISSION','resume',true);
    text('ESC = RESUME',x,208,10,'#b8c39c','center');
  }
  function drawEnd(won){
    shade(.86);const x=HUD+VW/2;
    text(won?'MISSION COMPLETE':norwayFailure||'SQUAD WIPED OUT',
      x,18,won?23:18,won?C.gold:'#e78a6d','center');
    text(operationName(missionIndex),x,50,10,C.cream,'center');
    rect(x-127,67,254,2,'#71834f');
    text(won?'PROMOTIONS  /  ROLL CALL':'LOST IN ACTION',x,78,10,C.mint,'center');
    soldiers.forEach((s,i)=>{
      const y=97+i*18,old=afterAction.promotions.find(p=>p.name===s.name);
      const label=s.alive?(won?shortRank(old?old.to:s.rank)+' '+s.name+'  +1 RANK':shortRank(s.rank)+' '+s.name+'  ALIVE'):
        'KIA   '+s.name;
      text(label,x,y,11,s.alive?C.cream:'#dc896e','center');
    });
    if(won){
      text('+'+RECRUITS_PER_VICTORY+' NEW RECRUITS JOIN THE RESERVE',x,158,9,C.sand,'center');
    }else{
      text('FALLEN: '+afterAction.fallen.length+'  /  MEMORIAL UPDATED',x,158,9,C.sand,'center');
    }
    text('KILLS '+kills+'   SCORE '+score,x,175,10,C.mint,'center');
    const w=Math.min(246,VW-40);
    resultStart={x:x-w/2,y:197,w,h:33};
    const label=won?(career.nextMission<=CAMPAIGN_MISSIONS?'NEXT: '+operationName(career.nextMission):'RETURN TO CAMP'):'REDEPLOY RECRUITS';
    button(resultStart.x,resultStart.y,w,33,label,'next',true);
    resultAlt={x:x-w/2,y:239,w,h:29};
    button(resultAlt.x,resultAlt.y,w,29,'THIS MISSION  /  MEMORIAL','memorial',false);
  }
  function draw(){
    rect(0,0,W,WH,'#141c15');
    if(terrain)drawWorld();
    drawHud();
    if(state==='playing'||state==='paused')drawControls();
    else rect(HUD,CTRL_Y,VW,WH-CTRL_Y,'#172119');
    if(state==='title')drawTitle();
    else if(state==='paused')drawPause();
    else if(state==='won')drawEnd(true);
    else if(state==='lost')drawEnd(false);
    else if(state==='roster')drawArchive();
    else if(state==='backup'||state==='backup-confirm')drawBackup();
    else if(state==='honours'||state==='memorial')drawMemorialScroll();
    // Border and small top HUD separators.
    if(state!=='honours'&&state!=='memorial')rect(HUD-3,0,3,WH,'#101711');
    if(state==='playing'&&panHint>0){
      const right=HUD+VW-9;
      text('MOVE / FIRE / GRENADE',right,5,8,'#d6e4b2','right');
    }
  }

  function audioInit(){
    if(!audioOn)return;
    if(!audioCtx)try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(_){return;}
    if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
    hasAudio=true;
  }
  function tone(freq,duration,type='square',volume=.03,slide=0){
    if(!audioOn||!audioCtx)return;
    const t=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
    osc.type=type;osc.frequency.setValueAtTime(freq,t);
    if(slide)osc.frequency.exponentialRampToValueAtTime(Math.max(25,freq+slide),t+duration);
    gain.gain.setValueAtTime(volume,t);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
    osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+duration+.01);
  }
  function sound(name){
    if(!hasAudio||!audioOn)return;
    if(name==='gun')tone(200,.055,'sawtooth',.016,-125);
    else if(name==='enemy')tone(100,.04,'sawtooth',.006,-52);
    else if(name==='boom'){tone(88,.32,'sawtooth',.065,-65);tone(45,.28,'triangle',.07,-20);}
    else if(name==='throw')tone(290,.08,'triangle',.014,-125);
    else if(name==='hit')tone(210,.09,'triangle',.023,-140);
    else if(name==='move')tone(480,.032,'sine',.012,-80);
    else if(name==='pickup'){tone(440,.12,'square',.020,220);}
    else if(name==='down')tone(175,.42,'triangle',.045,-130);
    else if(name==='fail')tone(100,.48,'sawtooth',.045,-70);
    else if(name==='start')tone(580,.18,'triangle',.025,200);
    else if(name==='victory'){
      tone(420,.3,'triangle',.040,160);
      // A short original ascending two-tone victory cue, not a sampled song.
    }
    else if(name==='error')tone(130,.12,'square',.02,-30);
  }

  function where(e){
    const r=canvas.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*WH;
    return{x,y,wx:x-HUD+cam.x,wy:y+cam.y};
  }
  function inside(p,b){return p.x>=b.x&&p.x<b.x+b.w&&p.y>=b.y&&p.y<b.y+b.h;}
  function cancelGesture(){
    gesture=null;hudPress=null;pointer.firePointer=null;pointer.down=false;mouseRight=false;fireUntil=0;
  }
  function onPointerDown(e){
    if(e.cancelable)e.preventDefault();
    // Ignore additional fingers: one battlefield gesture at a time.
    if(gesture||hudPress)return;
    canvas.focus();audioInit();
    const p=where(e);Object.assign(pointer,p);pointer.down=true;
    try{canvas.setPointerCapture(e.pointerId);}catch(_){}
    if(state==='title'){
      if(career.nextMission<=CAMPAIGN_MISSIONS&&inside(p,titleStart))resetMission();
      else if(inside(p,rosterStart))showArchive('roster');
      else if(inside(p,memorialStart))showArchive('memorial');
      else if(inside(p,backupStart))openBackup();
      else if(inside(p,worldMapStart))window.location.href='ww2-campaign.html';
      return;
    }
    if(state==='backup'||state==='backup-confirm'){
      if(inside(p,backupBackButton)){
        pendingBackup=null;
        if(state==='backup-confirm')openBackup();
        else state='title';
      }else if(state==='backup-confirm'){
        if(inside(p,backupConfirmButton))confirmBackupRestore();
      }else{
        if(inside(p,backupExportButton))exportBackup();
        else if(inside(p,backupImportButton))importBackup();
      }
      return;
    }
    if(state==='honours'||state==='memorial'){
      if(inside(p,memorialButton)){leaveMemorial();return;}
      if(inside(p,memorialWindow)){
        memorialFinger={id:e.pointerId,lastY:p.y};memorialHoldUntil=performance.now()+4000;
      }
      return;
    }
    if(state==='roster'){
      if(inside(p,archiveBack)){archiveFinger=null;state='title';}
      else if(p.y>=70&&p.y<=224)archiveFinger={id:e.pointerId,lastY:p.y};
      return;
    }
    if(state==='paused'){if(inside(p,resultStart))state='playing';return;}
    if(state==='won'||state==='lost'){
      if(inside(p,resultStart)){if(state==='won'&&career.nextMission>CAMPAIGN_MISSIONS)state='title';else resetMission();}
      else if(inside(p,resultAlt))enterMemorial(false,state,true);
      return;
    }
    if(p.x<HUD){
      if(p.y>=47&&p.y<66){if(split)chooseTeam(p.x<55?'A':'B');else chooseSquad(-1);}
      else if(p.y>=69&&p.y<165){
        const i=Math.floor((p.y-69)/32);
        if(i>=0&&i<3)hudPress={id:e.pointerId,soldier:i,started:performance.now(),done:false};
      }
      return;
    }
    if(p.y>=CTRL_Y){
      const hit=buttons().find(b=>inside(p,{x:b.x,y:CTRL_Y,w:b.w,h:35}));
      if(hit){
        if(hit.mode==='pause'){state='paused';cancelGesture();}
        else if(hit.mode==='sound'){audioOn=!audioOn;try{localStorage.setItem('green-dawn-audio-v2',audioOn?'on':'off');}catch(_){}if(audioOn)audioInit();}
        else if(hit.mode==='split')toggleSplit();
        else setMode(hit.mode);
      }
      return;
    }
    if(mode==='grenade'&&e.button!==2){throwGrenade(p.wx,p.wy);return;}
    // Do NOT move immediately. A release before the threshold issues a move;
    // a long press begins sustained fire towards the finger instead.
    gesture={id:e.pointerId,started:performance.now(),x:p.x,y:p.y,wx:p.wx,wy:p.wy,firing:e.button===2};
    if(gesture.firing){pointer.firePointer=e.pointerId;beginFire(p.wx,p.wy);}
  }
  function onPointerMove(e){
    if(memorialFinger){
      if(memorialFinger.id!==e.pointerId)return;
      const p=where(e);
      memorialOffset=clamp(memorialOffset+memorialFinger.lastY-p.y,-60,memorialMaximum());
      memorialFinger.lastY=p.y;memorialHoldUntil=performance.now()+4000;
      return;
    }
    if(archiveFinger){
      if(archiveFinger.id!==e.pointerId)return;
      const p=where(e);archiveScroll=clamp(archiveScroll+archiveFinger.lastY-p.y,0,maxArchiveScroll());
      archiveFinger.lastY=p.y;return;
    }
    if(gesture&&e.pointerId!==gesture.id)return;
    const p=where(e);Object.assign(pointer,p);
    if(gesture&&state==='playing'){
      gesture.x=clamp(p.x,HUD+1,W-2);
      gesture.y=clamp(p.y,1,CTRL_Y-2);
      gesture.wx=gesture.x-HUD+cam.x;gesture.wy=gesture.y+cam.y;
      if(gesture.firing)updateAim(gesture.wx,gesture.wy);
    }
  }
  function onPointerUp(e){
    if(memorialFinger){
      if(e.pointerId===memorialFinger.id)memorialFinger=null;
      return;
    }
    if(archiveFinger){if(e.pointerId===archiveFinger.id)archiveFinger=null;return;}
    if((gesture&&e.pointerId!==gesture.id)||(hudPress&&e.pointerId!==hudPress.id))return;
    if(hudPress){
      const press=hudPress;hudPress=null;
      if(!press.done&&e.type!=='pointercancel'&&state==='playing')chooseSquad(press.soldier);
      pointer.down=false;
      try{if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);}catch(_){}
      return;
    }
    if(gesture){
      const elapsed=performance.now()-gesture.started;
      if(state==='playing'&&!gesture.firing&&elapsed<HOLD_TO_FIRE_MS&&e.type!=='pointercancel'){
        moveSquad(gesture.wx,gesture.wy);
      }
      cancelGesture();
    }else pointer.down=false;
    try{if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);}catch(_){}
  }
  function pauseForBackground(){
    if(state==='playing'){state='paused';cancelGesture();}
  }
  function onKey(e){
    if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
    if(IS_WW2&&state==='title'&&e.code==='Escape'){
      window.location.href='ww2-campaign.html';return;
    }
    if(state==='backup'||state==='backup-confirm'){
      if(e.code==='Escape'){
        if(state==='backup-confirm')openBackup();else state='title';
      }else if(e.code==='Enter'&&state==='backup-confirm')confirmBackupRestore();
      return;
    }
    if((state==='honours'||state==='memorial')&&(e.code==='Enter'||e.code==='Space'||e.code==='Escape')){
      leaveMemorial();return;
    }
    if(state==='roster'&&e.code==='Escape'){state='title';return;}
    if(e.code==='KeyR'){if(state==='playing'||state==='paused')resetMission();return;}
    if(e.code==='KeyP'||e.code==='Escape'){
      if(state==='playing'){state='paused';cancelGesture();}
      else if(state==='paused')state='playing';return;
    }
    if(state==='title'&&(e.code==='Enter'||e.code==='Space')){if(career.nextMission<=CAMPAIGN_MISSIONS){audioInit();resetMission();}return;}
    if((state==='honours'||state==='memorial')&&(e.code==='Enter'||e.code==='Space'||e.code==='Escape')){
      leaveMemorial();return;
    }
    if((state==='honours'||state==='memorial')&&(e.code==='ArrowDown'||e.code==='ArrowUp')){
      memorialOffset=clamp(memorialOffset+(e.code==='ArrowDown'?42:-42),-60,memorialMaximum());
      memorialHoldUntil=performance.now()+4000;return;
    }
    if(state==='roster'&&e.code==='Escape'){state='title';return;}
    if(state==='won'||state==='lost'){if(e.code==='Enter'||e.code==='Space'){audioInit();if(state==='won'&&career.nextMission>CAMPAIGN_MISSIONS)state='title';else resetMission();}return;}
    if(state!=='playing')return;
    if(e.code==='Digit0')chooseSquad(-1);
    if(e.code==='KeyX')toggleSplit();
    if(e.code==='Digit4')chooseTeam('A');
    if(e.code==='Digit5')chooseTeam('B');
    if(['Digit1','Digit2','Digit3'].includes(e.code))chooseSquad(Number(e.code.slice(-1))-1);
    if(e.code==='KeyM')setMode('move');
    if(e.code==='KeyF')setMode('fire');
    if(e.code==='KeyG')setMode('grenade');
    if(e.code==='Space'){beginFire(pointer.wx,pointer.wy);}
  }
  let last=performance.now();
  function tick(t){const dt=clamp((t-last)/1000,0,.04);last=t;timeNow=t;
    if((state==='honours'||state==='memorial')&&!memorialFinger&&
       t>memorialHoldUntil&&memorialEntries().length){
      memorialOffset+=dt*14;
      if(memorialOffset>memorialMaximum())memorialOffset=-48;
    }
    if(state==='playing'&&hudPress&&!hudPress.done&&split&&t-hudPress.started>=520){
      hudPress.done=true;transferSoldier(hudPress.soldier);
    }
    if(state==='playing'&&gesture){
      if(!gesture.firing&&t-gesture.started>=HOLD_TO_FIRE_MS){
        gesture.firing=true;pointer.firePointer=gesture.id;
        beginFire(gesture.wx,gesture.wy);
      }
      if(gesture.firing){
        // Recalculate aim as the camera follows moving soldiers underneath a held finger.
        updateAim(gesture.x-HUD+cam.x,gesture.y+cam.y);
      }
    }
    if(state==='playing')update(dt);
    draw();requestAnimationFrame(tick);
  }
  canvas.addEventListener('pointerdown',onPointerDown,{passive:false});
  canvas.addEventListener('pointermove',onPointerMove,{passive:false});
  canvas.addEventListener('pointerup',onPointerUp,{passive:false});
  canvas.addEventListener('pointercancel',onPointerUp,{passive:false});
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  window.addEventListener('keydown',onKey);
  window.addEventListener('resize',resize);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseForBackground();});
  window.addEventListener('pagehide',pauseForBackground);
  window.addEventListener('green-dawn-pause',pauseForBackground);
  loadSave();missionIndex=Math.min(CAMPAIGN_MISSIONS,career.nextMission);
  if(IS_WW2)prepareNorwayMission();
  else extraction=missionIndex===3?{x:913,y:157,r:27}:{x:319,y:91,r:25};
  resize();generateTerrain();
  if(career.pendingHonours){
    // If the app was closed at the ceremony, show it again on return rather
    // than silently skipping the fallen heroes' names.
    const pending=career.pendingHonours;
    afterAction.fallen=career.fallen.filter(f=>pending.fallen?.includes(f.id));
    missionIndex=pending.operation;
    enterMemorial(true,'title');
  }
  soldiers=deployment().map((m,i)=>({name:m.name,rank:m.rank,careerId:m.id,x:111+i*9,y:573+i*11,
    alive:true,team:'A',path:[],face:-.6,id:i}));
  enemies=[];
  if(!IS_WW2)bunker={x:871,y:119,w:67,h:53,hp:8,maxHp:8,dead:false};
  ammo={x:461,y:371,taken:false};
  cam={x:0,y:MH-VH};
  // Expose a tiny read-only test surface to catch playability regressions.
  Object.defineProperty(window,'GREEN_DAWN_TEST',{value:{
    get status(){return {state,campaign:IS_WW2?'ww2':'jungle',plannedMissions:CAMPAIGN_PLAN,
      availableMissions:CAMPAIGN_MISSIONS,mission:missionIndex,nextMission:career.nextMission,mode,score,kills,grenades,alive:soldiers.filter(s=>s.alive).length,enemyCount:enemies.filter(e=>e.alive).length,bunkerHp:bunker.hp,bunkerDead:bunker.dead,objectiveKind:bunker.kind,reinforcementsSent,extraction:{...extraction},completed:career.victories.map(v=>v.mission),camera:{...cam},time:clock};},
    get norway(){return IS_WW2?{
      operation:missionIndex,kind:norwayLayout?.kind||'coastal',
      title:operationName(missionIndex),objective:norwayObjective(),
      checkpoints: norwayLayout?.checkpoints?.map(p=>({x:p[0],y:p[1]}))||[],
      clearedRidges:norwayCheckpoint,
      targets:norwayTargets.map(t=>({x:t.x,y:t.y,hp:t.hp,dead:t.dead,kind:t.kind})),
      convoy:norwayConvoy?{x:norwayConvoy.x,y:norwayConvoy.y,
        hp:norwayConvoy.health,waypoint:norwayConvoy.index,
        ambushes:norwayConvoy.ambushes,delivered:norwayConvoy.delivered}:null,
      rescued:norwayRescued,holdRemaining:norwayHold,
      holding:norwayHoldStarted,waves:norwayWaves,
      waveLimit:norwayWaveLimit,failed:norwayFailure
    }:null;},
    get dunkirk(){return isDunkirk()?{
      mission:missionIndex,kind:norwayLayout.kind,title:operationName(missionIndex),
      objective:dunkirkObjective(),rallies:dunkirkRallies,
      rallyTotal:norwayLayout.rally?.length||0,
      targetCount:norwayTargets.length,
      targets:norwayTargets.map(t=>({id:t.id,dead:t.dead,hp:t.hp,kind:t.kind,x:t.x,y:t.y})),
      holdStarted:norwayHoldStarted,holdRemaining:norwayHold,
      waves:norwayWaves,waveLimit:norwayWaveLimit,
      bridgeHp:dunkirkBridgeHp,roadblockHp:dunkirkBarrierHp,
      crossings:dunkirkColumns,phase:dunkirkPhase,
      convoy:norwayConvoy?{x:norwayConvoy.x,y:norwayConvoy.y,
        hp:norwayConvoy.health,waypoint:norwayConvoy.index,
        ambushes:norwayConvoy.ambushes,delivered:norwayConvoy.delivered}:null,
      failed:norwayFailure
    }:null;},
    get controls(){return {pending:!!(gesture&&!gesture.firing),firing:!!(gesture&&gesture.firing),shotsFired:playerShots,aim:{...aim},holdMs:HOLD_TO_FIRE_MS};},
    get roster(){return soldiers.map(s=>({name:s.name,careerId:s.careerId,rank:s.rank,x:s.x,y:s.y,alive:s.alive,team:s.team,followId:s.followId??null,followGap:s.followGap||0,trailPoints:s.trail?.length||0,followGoal:s.followGoal||null,pathLength:s.path.length,destination:s.path.at(-1)||null}));},
    get career(){return JSON.parse(JSON.stringify(career));},
    get afterAction(){return JSON.parse(JSON.stringify(afterAction));},
    get ceremony(){return {state,automatic:memorialAutomatic,returnTo:memorialReturn,
      offset:memorialOffset,operation:memorialOperation,recent:[...memorialRecent],
      missionOnly:memorialMissionOnly,displayed:memorialEntries().map(f=>({id:f.id,mission:f.mission,rank:f.rank})),
      pending:career.pendingHonours||null};},
    get squads(){return {split,selected,alpha:soldiers.filter(s=>s.alive&&s.team==='A').map(s=>s.name),bravo:soldiers.filter(s=>s.alive&&s.team==='B').map(s=>s.name)};},
    get enemyAI(){return enemies.map(e=>({id:e.id,alive:e.alive,x:e.x,y:e.y,tactic:e.tactic,
      alert:e.alert,suppressed:e.suppressed,coverTime:e.coverTime,coverPath:e.coverPath.length}));},
    get combatEffects(){return {gunEffects:gunEffects.length,fallenBodies:fallenBodies.length};},
    toggleSplit:()=>toggleSplit(),
    selectTeam:(team)=>chooseTeam(team),
    transfer:(id)=>transferSoldier(id),
    commandMove:(x,y,leadId)=>moveSquad(x,y,leadId),
    commandFire:(x,y)=>{beginFire(x,y);fireUntil=clock+2.5;},
    commandGrenade:(x,y)=>throwGrenade(x,y),
    start:()=>resetMission(),
    select:(id)=>chooseSquad(id),
    setMode:(id)=>setMode(id),
    goToCamp:()=>{cancelGesture();state='title';},
    showMemorial:()=>showArchive('memorial'),
    showRoster:()=>showArchive('roster'),
    get walkable(){return mapData.filter(Boolean).length;},
    path:(ax,ay,bx,by)=>pathfind(ax,ay,bx,by)
  }});
  // Android WebView uses a virtual HTTPS origin and already contains all the
  // files offline. Do not register a Service Worker on that synthetic host.
  if('serviceWorker' in navigator && location.protocol.startsWith('http') && location.hostname!=='appassets.androidplatform.net'){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
  requestAnimationFrame(tick);
})();

</script>

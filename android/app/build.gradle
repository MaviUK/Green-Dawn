plugins { id 'com.android.application' }

android {
    namespace 'uk.co.greendawn.jungle'
    compileSdk 35

    defaultConfig {
        applicationId 'uk.co.greendawn.jungle'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.9.0'
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

plugins { id 'com.android.application' }

// Persistent certificate ONLY via GitHub Actions secrets. Never commit a key.
def stableStore=System.getenv('GREEN_DAWN_KEYSTORE_PATH')
def stableStorePassword=System.getenv('GREEN_DAWN_KEYSTORE_PASSWORD')
def stableAlias=System.getenv('GREEN_DAWN_KEY_ALIAS')
def stableKeyPassword=System.getenv('GREEN_DAWN_KEY_PASSWORD')
def stableSigning=stableStore && stableStorePassword && stableAlias && stableKeyPassword

android {
    namespace 'uk.co.greendawn.jungle'
    compileSdk 35

    defaultConfig {
        applicationId 'uk.co.greendawn.jungle'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '0.14.0'
    }
    signingConfigs {
        if (stableSigning) {
            greenDawnPersistent {
                storeFile file(stableStore)
                storePassword stableStorePassword
                keyAlias stableAlias
                keyPassword stableKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            debuggable true
            if (stableSigning) signingConfig signingConfigs.greenDawnPersistent
        }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

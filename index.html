<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#151d13">
  <meta name="description" content="Green Dawn — an original 16-bit inspired squad tactics game. Mission 01: Jungle Assault.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  
  <title>GREEN DAWN — Mission 01</title>
  <style>
    * { box-sizing:border-box; }
    :root{color-scheme:dark;--dark:#111812;--olive:#344a2e;--sand:#d7c58e;--mint:#c0dba4}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--dark);color:#f0e7c9;font-family:"Courier New",monospace}
    html{-webkit-tap-highlight-color:transparent}
    #game-container{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#101711;overflow:hidden}
    #game{display:block;width:100%;height:100%;object-fit:fill;touch-action:none;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair;outline:none}
    #orientation{display:none;z-index:50;position:absolute;inset:0;background:#151d13;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:26px}
    #orientation .icon{font-size:58px;line-height:1}
    #orientation h1{font-size:22px;margin:0;color:#f0d478;letter-spacing:3px}
    #orientation p{font-size:13px;max-width:280px;line-height:1.7;color:#bdc7a5}
    @media (orientation:portrait) and (max-width:800px){#orientation{display:flex} #game{opacity:.2}}
  </style>
</head>
<body>
  <main id="game-container">
    <canvas id="game" tabindex="0" aria-label="Green Dawn jungle assault game. Landscape game. Tap to move, hold to fire, drag to aim. Tap SPLIT to make Alpha and Bravo groups; select either group or a soldier, hold a soldier name to transfer, tap JOIN to reunite."></canvas>
    <div id="orientation" role="status"><div class="icon">↻</div><h1>ROTATE TO DEPLOY</h1><p>Turn your phone sideways for the full 16-bit battlefield.</p></div>
  </main>
  <script>
/*
  GREEN DAWN v0.6 — MISSION 01: JUNGLE ASSAULT
  Original game, procedural pixel art, original gameplay code and synthesized SFX.
  No art/music/code from Cannon Fodder or any other game is used.
*/
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', {alpha:false});
  const WH = 288, HUD = 110, CTRL_Y=253, MW=1024, MH=672, CELL=16;
  const COLS=Math.ceil(MW/CELL), ROWS=Math.ceil(MH/CELL);
  const C = { ink:'#101712', edge:'#0b100d', dark:'#1c261c', steel:'#293428', olive:'#43572e',
    green:'#90b963', mint:'#c2db94', cream:'#f5e6bd', sand:'#e4c873', gold:'#f3c95b',
    danger:'#e27e52', hud:'#20291f', red:'#a73d32', shadow:'#162015' };
  const DIFFICULTY = { enemySight:142, enemyFire:1.50, gunRate:.18, moveSpeed:73, grenadeRadius:53 };
  const ENEMY_AI = {hearing:198, alertDuration:4.5, coverRadius:80, suppressionRadius:21};
  let W=512,VW=402,VH=CTRL_Y,state='title',mode='move',selected=-1,split=false;
  let cam={x:0,y:0}, pointer={x:0,y:0,wx:0,wy:0,down:false,firePointer:null};
  const HOLD_TO_FIRE_MS=240; // one finger: quick tap moves, long hold shoots
  const MARCH_GAP=19, TRAIL_STEP=3, TRAIL_LIMIT=620; // one-file marching, each soldier follows actual footsteps
  let gesture=null; // {id,started,x,y,wx,wy,firing}; active battlefield finger only
  let hudPress=null; // hold a soldier row to transfer between Alpha and Bravo
  let soldiers=[],enemies=[],bullets=[],bombs=[],particles=[],decals=[],trees=[],rocks=[];
  let gunEffects=[],fallenBodies=[]; // tiny transient pixel art combat effects
  let bunker,ammo,terrain,mapData=[],clock=0,shotClock=0,fireUntil=0,aim={x:0,y:0};
  let score=0,kills=0,grenades=3,started=0,freeze=0,message='',messageTime=0,panHint=0;
  let timeNow=0,mouseRight=false,hasAudio=false,audioOn=true,audioCtx=null,objectiveArrow=0;
  let playerShots=0;
  let saved={wins:0,bestScore:0,bestSurvivors:0};
  // A small settings key that survives a native WebView restart.
  try {audioOn=localStorage.getItem('green-dawn-audio-v2')!=='off';}catch(_){}
  let seed=1;
  const rng=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
  const rnd=(a,b)=>a+rng()*(b-a),rand=(a,b)=>a+Math.random()*(b-a);
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const dist=(x,y,a,b)=>Math.hypot(x-a,y-b);
  const pointDist=(p,q)=>dist(p.x,p.y,q.x,q.y);
  const isMobile=()=>('ontouchstart' in window)||(navigator.maxTouchPoints>0);
  let pathLine=[{x:92,y:590},{x:227,y:539},{x:355,y:443},{x:498,y:359},{x:601,y:331},{x:718,y:284},{x:820,y:209},{x:883,y:143}];

  function loadSave(){
    try {const d=JSON.parse(localStorage.getItem('green-dawn-career-v1')||'{}');saved={...saved,...d};}catch(_){/* file:// storage may be unavailable */}
  }
  function saveCareer(){
    try{saved.wins++;saved.bestScore=Math.max(saved.bestScore,score);saved.bestSurvivors=Math.max(saved.bestSurvivors,soldiers.filter(s=>s.alive).length);localStorage.setItem('green-dawn-career-v1',JSON.stringify(saved));}catch(_){}
  }

  function resize(){
    const ratio=window.innerWidth/window.innerHeight;
    W=Math.round(WH*clamp(ratio,1.75,2.35));VW=W-HUD;
    canvas.width=W;canvas.height=WH;
    ctx.imageSmoothingEnabled=false;
    if(state==='playing') clampCamera();
  }
  const riverX=(y)=>602+20*Math.sin(y*.012)+7*Math.sin(y*.043);
  const onBridge=(x,y)=>y>=310&&y<=349&&Math.abs(x-riverX(y))<77;
  const inRiver=(x,y)=>Math.abs(x-riverX(y))<31;
  function lineDistance(x,y,route){
    let best=Infinity;
    for(let i=0;i<route.length-1;i++){
      const a=route[i],b=route[i+1];const dx=b.x-a.x,dy=b.y-a.y;
      const t=clamp(((x-a.x)*dx+(y-a.y)*dy)/(dx*dx+dy*dy),0,1);
      best=Math.min(best,dist(x,y,a.x+t*dx,a.y+t*dy));
    }
    return best;
  }

  function generateTerrain(){
    seed=378194;
    trees=[];rocks=[];
    terrain=document.createElement('canvas');terrain.width=MW;terrain.height=MH;
    const g=terrain.getContext('2d');g.imageSmoothingEnabled=false;
    g.fillStyle='#60793c';g.fillRect(0,0,MW,MH);
    // A distinctive, original dithered 16-bit green jungle ground.
    const greens=['#6b843d','#546d35','#5b7539','#64813d','#779248','#4b682f','#819b50'];
    for(let y=0;y<MH;y+=4) for(let x=0;x<MW;x+=4){
      const rr=rng(),distance=lineDistance(x,y,pathLine);
      if(rr<.22||rr>.83){g.fillStyle=greens[(rng()*greens.length)|0];g.fillRect(x,y,4,4);}
      if(rr>.972&&distance>20){g.fillStyle='#91a757';g.fillRect(x+1,y+2,1,2);g.fillRect(x+3,y,1,1);}
    }
    // Sinuous brown track with irregular edges and stones.
    g.lineCap='round';g.lineJoin='round';
    g.strokeStyle='#394f2d';g.lineWidth=43;
    drawRoute(g,pathLine);
    g.strokeStyle='#846e41';g.lineWidth=31;drawRoute(g,pathLine);
    g.strokeStyle='#9a7e4a';g.lineWidth=24;drawRoute(g,pathLine);
    for(let i=0;i<4000;i++){
      const k=(rng()*(pathLine.length-1))|0, t=rng(),a=pathLine[k],b=pathLine[k+1];
      const xx=a.x+(b.x-a.x)*t+rnd(-17,17), yy=a.y+(b.y-a.y)*t+rnd(-17,17);
      if(xx>0&&xx<MW&&yy>0&&yy<MH&&Math.abs(xx-riverX(yy))>40){
        g.fillStyle=rng()<.65?'#ae8a50':'#695e35';g.fillRect(xx|0,yy|0,1+rng()*3,1+rng()*2);
      }
    }
    // Original river, banks, ripples and timber bridge.
    for(let y=0;y<MH;y+=2){
      const x=riverX(y);
      g.fillStyle='#445b30';g.fillRect(x-44,y,88,2);
      g.fillStyle='#c19e56';g.fillRect(x-36,y,72,2);
      g.fillStyle='#263f44';g.fillRect(x-32,y,64,2);
      g.fillStyle='#28576b';g.fillRect(x-27,y,54,2);
      g.fillStyle='#346d78';g.fillRect(x-19,y,38,2);
      if(y%8===0){g.fillStyle='#609290';g.fillRect(x+rnd(-18,18),y,4+rng()*9,1);}
    }
    for(let i=0;i<110;i++){
      const y=rnd(0,MH), x=riverX(y)+rnd(-24,24);
      g.fillStyle=rng()<.7?'#6e9e98':'#28505f';g.fillRect(x|0,y|0,3+rng()*8,1);
    }
    const bx=riverX(329);
    g.fillStyle='#161d18';g.fillRect(bx-60,305,119,50);
    g.fillStyle='#584b31';g.fillRect(bx-58,309,116,42);
    g.fillStyle='#8f6b3f';g.fillRect(bx-58,314,116,32);
    for(let i=0;i<12;i++){
      const x=bx-55+i*10;g.fillStyle=i%2?'#745936':'#a48751';g.fillRect(x,314,8,32);
      g.fillStyle='#4f452b';g.fillRect(x+7,315,2,29);
      g.fillStyle='#cc9a5d';g.fillRect(x+1,316,5,2);
    }
    g.fillStyle='#b8a16a';g.fillRect(bx-60,307,120,4);g.fillRect(bx-60,348,120,4);
    for(let i=0;i<7;i++){g.fillStyle='#4a4430';g.fillRect(bx-56+i*18,309,3,5);g.fillRect(bx-56+i*18,347,3,5);}
    // Border forest and pockets of trees. Keep vital route & bridge navigable.
    let attempts=0;
    while(trees.length<355&&attempts<3500){
      attempts++;
      const x=rnd(10,MW-10),y=rnd(10,MH-10),r=rnd(10,19);
      if(lineDistance(x,y,pathLine)<42+r*.4) continue;
      if(Math.abs(x-riverX(y))<44+r) continue;
      if(dist(x,y,110,576)<70||dist(x,y,885,145)<81) continue;
      if(trees.some(t=>dist(x,y,t.x,t.y)<(r+t.r)*.68))continue;
      trees.push({x:Math.floor(x),y:Math.floor(y),r:Math.floor(r),kind:(rng()*4)|0});
    }
    trees.sort((a,b)=>a.y-b.y);
    // Small boulders and grass tufts in clearings.
    for(let i=0;i<180;i++){
      const x=rnd(13,MW-13),y=rnd(10,MH-10);
      if(inRiver(x,y)||lineDistance(x,y,pathLine)<16) continue;
      g.fillStyle=rng()<.5?'#3f6b2f':'#9aa34a';
      g.fillRect(x,y,2,5);g.fillRect(x+2,y+2,2,3);
      if(rng()<.2){g.fillStyle='#a3a18a';g.fillRect(x+1,y+2,3,2);}
    }
    for(const t of trees) drawTree(g,t);
    // Wooden crates, tyre tracks and debris give the battlefield visual landmarks.
    for(const [x,y] of [[345,458],[747,278],[830,223],[454,384]]){
      g.fillStyle='#302e20';g.fillRect(x-10,y+4,20,9);
      g.fillStyle='#806a3b';g.fillRect(x-9,y-2,17,13);
      g.fillStyle='#b3995a';g.fillRect(x-8,y-1,15,2);
      g.strokeStyle='#53472d';g.lineWidth=2;g.strokeRect(x-8,y,15,10);
      g.beginPath();g.moveTo(x-8,y);g.lineTo(x+7,y+10);g.stroke();
    }
    // Darken world boundaries, visually separate the playable area.
    g.fillStyle='#233526';g.fillRect(0,0,MW,6);g.fillRect(0,MH-6,MW,6);
    g.fillRect(0,0,6,MH);g.fillRect(MW-6,0,6,MH);
    buildNav();
  }
  function drawRoute(g,points){g.beginPath();g.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)g.lineTo(points[i].x,points[i].y);g.stroke();}
  function drawTree(g,t){
    const {x,y,r,kind}=t;
    const colors=[
      ['#163625','#234d27','#3d642c','#5e8333','#83a344'],
      ['#153728','#30562b','#527a31','#658a38','#94a949'],
      ['#1c3926','#36582c','#4a7331','#75913b','#a0a851'],
      ['#1a3724','#335429','#4c6d2e','#688b35','#8a9e43']
    ][kind];
    // Trunk and canopy shadow are visible at the bottom of each tree.
    g.fillStyle='#193526';g.fillRect(x-r+3,y+2,2*r,11);
    g.fillStyle='#4c3924';g.fillRect(x-3,y+5,7,16);
    g.fillStyle='#91623d';g.fillRect(x-1,y+6,3,13);
    const blobs=[{x:-r*.31,y:-r*.12,rx:r*.74,ry:r*.78},
      {x:r*.28,y:-r*.33,rx:r*.76,ry:r*.83},
      {x:r*.02,y:r*.26,rx:r*.9,ry:r*.67}];
    for(let dy=-r-7;dy<=r+5;dy+=3)for(let dx=-r-7;dx<=r+7;dx+=3){
      let hit=false;
      for(const b of blobs){
        const xx=(dx-b.x)/b.rx, yy=(dy-b.y)/b.ry;
        if(xx*xx+yy*yy<1){hit=true;break;}
      }
      if(!hit||rng()<.095)continue;
      let c=dy>r*.45?1:dy>0?2:dy<(-r*.5)?3:3;
      if(dx<-r*.25&&dy<-r*.25)c=4;
      if(rng()<.22)c=Math.min(4,c+1);
      if(rng()<.14)c=Math.max(0,c-1);
      g.fillStyle=colors[c];g.fillRect(x+dx,y+dy,3,3);
    }
    for(let i=0;i<8;i++){
      const xx=x+rnd(-r*.65,r*.65),yy=y+rnd(-r*.76,r*.56);
      g.fillStyle=i%3===0?'#b0a95a':colors[4];g.fillRect(xx|0,yy|0,2,2);
    }
  }

  function blocked(x,y,margin=4){
    if(x<12||y<12||x>MW-13||y>MH-13) return true;
    if(inRiver(x,y)&&!onBridge(x,y))return true;
    if(x>858-margin&&x<919+margin&&y>114-margin&&y<166+margin)return true;
    for(const t of trees){if(Math.abs(x-t.x)>t.r+margin+3||Math.abs(y-t.y)>t.r+margin+3)continue;if(dist(x,y,t.x,t.y)<t.r*.72+margin)return true;}
    return false;
  }
  function buildNav(){
    mapData=Array.from({length:COLS*ROWS},(_,i)=>{
      const x=(i%COLS)*CELL+CELL/2,y=Math.floor(i/COLS)*CELL+CELL/2;
      return !blocked(x,y,3);
    });
  }
  const navId=(x,y)=>y*COLS+x;
  function walkNearest(x,y){
    let gx=clamp(Math.floor(x/CELL),0,COLS-1),gy=clamp(Math.floor(y/CELL),0,ROWS-1);
    if(mapData[navId(gx,gy)])return {x:gx,y:gy};
    for(let r=1;r<18;r++){
      let best=null,bestD=Infinity;
      for(let yy=gy-r;yy<=gy+r;yy++)for(let xx=gx-r;xx<=gx+r;xx++){
        if(xx<0||yy<0||xx>=COLS||yy>=ROWS||Math.abs(xx-gx)!==r&&Math.abs(yy-gy)!==r||!mapData[navId(xx,yy)])continue;
        const d=(xx*CELL+8-x)**2+(yy*CELL+8-y)**2;
        if(d<bestD){bestD=d;best={x:xx,y:yy};}
      }
      if(best)return best;
    }
    return {x:gx,y:gy};
  }
  function pathfind(ax,ay,bx,by){
    const start=walkNearest(ax,ay),goal=walkNearest(bx,by),startId=navId(start.x,start.y),goalId=navId(goal.x,goal.y);
    if(startId===goalId)return [{x:goal.x*CELL+8,y:goal.y*CELL+8}];
    const size=COLS*ROWS, g=new Float64Array(size);g.fill(Infinity);
    const came=new Int32Array(size);came.fill(-1);
    const closed=new Uint8Array(size),open=[{id:startId,f:0}];g[startId]=0;
    let loops=0,found=false;
    while(open.length&&loops++<7000){
      // Small grid: linear minimum selection avoids heap allocations on Android.
      let k=0;for(let i=1;i<open.length;i++)if(open[i].f<open[k].f)k=i;
      const {id}=open.splice(k,1)[0];if(closed[id])continue;
      if(id===goalId){found=true;break;}closed[id]=1;
      const x=id%COLS,y=Math.floor(id/COLS);
      for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
        if(!ox&&!oy)continue;
        const xx=x+ox,yy=y+oy;
        if(xx<0||yy<0||xx>=COLS||yy>=ROWS)continue;
        const n=navId(xx,yy);
        if(!mapData[n]||closed[n])continue;
        if(ox&&oy&&(!mapData[navId(x+ox,y)]||!mapData[navId(x,y+oy)]))continue;
        const step=ox&&oy?1.4142:1,scoreSoFar=g[id]+step;
        if(scoreSoFar<g[n]){
          came[n]=id;g[n]=scoreSoFar;
          const h=Math.hypot(goal.x-xx,goal.y-yy);
          open.push({id:n,f:scoreSoFar+h});
        }
      }
    }
    if(!found)return [];
    const result=[];let node=goalId;
    while(node!==-1&&node!==startId&&result.length<400){
      result.push({x:(node%COLS)*CELL+8,y:Math.floor(node/COLS)*CELL+8});node=came[node];
    }
    result.reverse();
    // Remove unnecessary grid corners while sampling every intervening step.
    // This gives soldiers smooth, direct movement without allowing them to
    // shortcut across a river or cut through the trees beside the bridge.
    const clearSegment=(a,b)=>{
      const d=pointDist(a,b),samples=Math.max(1,Math.ceil(d));
      for(let k=1;k<=samples;k++){
        const t=k/samples;
        if(blocked(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t,4))return false;
      }
      return true;
    };
    const smooth=[];
    let origin={x:ax,y:ay},i=0;
    while(i<result.length){
      let last=i;
      for(let k=result.length-1;k>i;k--){if(clearSegment(origin,result[k])){last=k;break;}}
      smooth.push(result[last]);origin=result[last];i=last+1;
    }
    return smooth;
  }

  function resetMission(){
    state='playing';mode='move';selected=-1;split=false;clock=0;started=performance.now()/1000;
    cancelGesture();shotClock=0;score=0;kills=0;grenades=3;freeze=0;playerShots=0;
    soldiers=[
      {name:'JAX',x:111,y:573,alive:true,rank:1,fire:0,path:[],face:-.6,id:0,team:'A',color:'#4f803d'},
      {name:'ACE',x:95,y:592,alive:true,rank:1,fire:.05,path:[],face:-.6,id:1,team:'A',color:'#637e3d'},
      {name:'PIP',x:120,y:604,alive:true,rank:1,fire:.1,path:[],face:-.6,id:2,team:'A',color:'#779447'}
    ];
    const posts=[[287,498],[392,429],[501,344],[565,330],[701,282],[775,239],[822,197],[906,238],[863,315]];
    enemies=posts.map((p,i)=>({x:p[0],y:p[1],homeX:p[0],homeY:p[1],id:i,health:1,alive:true,
      dir:(i*2.2)%6.28,fire:rand(.5,1.4),wander:rand(.7,3),patrolX:p[0],patrolY:p[1],seen:false,
      tactic:'patrol',alert:0,aimTime:0,suppressed:0,coverTime:0,coverCooldown:0,
      coverPath:[],investigatePath:[],investigateTimer:0,lastKnown:null,burstFlash:0}));
    bunker={x:871,y:119,w:67,h:53,hp:8,maxHp:8,dead:false};
    ammo={x:461,y:371,taken:false};
    bullets=[];bombs=[];particles=[];decals=[];gunEffects=[];fallenBodies=[];
    message='REACH THE RADIO BUNKER';messageTime=5.2;panHint=7;
    aim={x:700,y:300};
    cam.x=clamp(111-VW*.34,0,MW-VW);cam.y=clamp(573-VH*.70,0,MH-VH);
    sound('start');
  }
  function currentSoldiers(){
    const live=soldiers.filter(s=>s.alive);
    if(selected===-1)return live;
    if(selected==='A'||selected==='B'){
      const team=live.filter(s=>s.team===selected);
      return team.length?team:live;
    }
    const chosen=soldiers[selected];return chosen&&chosen.alive?[chosen]:live;
  }
  function teamCount(team){return soldiers.filter(s=>s.alive&&s.team===team).length;}
  function focusSelection(){
    const group=currentSoldiers();
    const leader=group.find(s=>s.followId===null||s.followId===undefined)||group[0];
    if(!leader)return;
    cam.x=clamp(leader.x-VW*.41,0,Math.max(0,MW-VW));
    cam.y=clamp(leader.y-VH*.56,0,MH-VH);
  }
  function chooseTeam(team){
    if(!split){selected=-1;focusSelection();return;}
    if(teamCount(team)===0){flash(team==='A'?'ALPHA HAS NO SURVIVORS':'BRAVO HAS NO SURVIVORS',1.7);sound('error');return;}
    selected=team;cancelGesture();focusSelection();
    flash(team==='A'?'ALPHA SELECTED':'BRAVO SELECTED',1.2);
  }
  function chooseSquad(id){
    if(id<0){if(split)toggleSplit();else {selected=-1;focusSelection();flash('ALL SOLDIERS',1.3);}return;}
    if(!soldiers[id]||!soldiers[id].alive){flash('SOLDIER LOST',1.4);sound('error');return;}
    selected=id;cancelGesture();focusSelection();flash(soldiers[id].name+' SELECTED',1.2);
  }
  function toggleSplit(){
    cancelGesture();
    if(split){
      // JOIN is a physical rally at the selected leader, not a teleport.
      const leader=currentSoldiers()[0];
      const rally=leader?{x:leader.x,y:leader.y}:null;
      split=false;selected=-1;soldiers.forEach(s=>s.team='A');
      if(rally)moveSquad(rally.x,rally.y,leader.id);
      focusSelection();flash('SQUADS REGROUPING',2);sound('move');return;
    }
    const live=soldiers.filter(s=>s.alive);
    if(live.length<2){flash('NEED 2 SOLDIERS TO SPLIT',2);sound('error');return;}
    // Anyone who moves to Bravo must stop trailing the Alpha leader;
    // retain the old destination as an independent marching order.
    live.forEach((s,i)=>s.team=i===live.length-1?'B':'A');
    for(const s of live) if(s.followId!==null&&s.followId!==undefined&&
      soldiers[s.followId].team!==s.team)detachFromLeader(s,true);
    split=true;selected='A';focusSelection();flash('ALPHA + BRAVO: TAP TEAM TO SWITCH',2.7);sound('move');
  }
  function transferSoldier(id){
    if(!split||!soldiers[id]||!soldiers[id].alive)return false;
    const s=soldiers[id],from=s.team,to=from==='A'?'B':'A';
    if(teamCount(from)<2){flash('EACH TEAM NEEDS A SOLDIER',1.9);sound('error');return false;}
    // Keep the remaining squad moving if this was its leader.
    releaseFollowersOf(s);
    detachFromLeader(s,false);
    s.team=to;
    const destinationTeam=soldiers.filter(q=>q.alive&&q.team===to&&q.id!==id);
    const teamLead=destinationTeam.find(q=>q.followId===null||q.followId===undefined)||destinationTeam[0];
    if(teamLead){
      if(!teamLead.trail||!teamLead.trail.length)startFootsteps(teamLead);
      assignFollower(s,teamLead,destinationTeam.length);
    }
    selected=to;focusSelection();
    flash(s.name+' MOVED TO '+(to==='A'?'ALPHA':'BRAVO'),2);sound('move');return true;
  }
  function flash(txt,duration=2){message=txt;messageTime=duration;}

  // Each squad follows one leader. The leader records an actual ground trail
  // and each follower targets a point a fixed distance behind them, keeping
  // natural single-file spacing through narrow gaps and over the bridge.
  function startFootsteps(s){
    s.trailWalked=0;s.trail=[{x:s.x,y:s.y,walked:0}];
  }
  function recordFootsteps(s){
    if(!s.trail||!s.trail.length)startFootsteps(s);
    const last=s.trail[s.trail.length-1],walked=dist(s.x,s.y,last.x,last.y);
    if(walked<TRAIL_STEP)return;
    s.trailWalked+=walked;
    s.trail.push({x:s.x,y:s.y,walked:s.trailWalked});
    if(s.trail.length>TRAIL_LIMIT)s.trail.shift();
  }
  function footstepBehind(leader,gap){
    const trail=leader.trail;
    if(!trail||!trail.length)return {x:leader.x,y:leader.y};
    const target=Math.max(0,(leader.trailWalked||0)-gap);
    if(target<=trail[0].walked){
      // The leader has not yet walked far enough to leave a complete trail.
      // Place followers *behind* the starting point, rather than piling
      // every soldier onto that point when the leader stops to regroup.
      const remaining=Math.max(0,gap-(leader.trailWalked||0));
      const origin=trail[0];
      const heading=trail.length>1?
        Math.atan2(trail[1].y-origin.y,trail[1].x-origin.x):leader.face||0;
      for(const turn of [0,.65,-.65,1.3,-1.3,Math.PI]){
        const angle=heading+turn;
        const candidate={x:origin.x-Math.cos(angle)*remaining,
          y:origin.y-Math.sin(angle)*remaining};
        if(candidate.x<12||candidate.y<12||candidate.x>MW-12||candidate.y>MH-12)continue;
        if(!blocked(candidate.x,candidate.y,4)&&walkClear(origin,candidate))return candidate;
      }
      return origin;
    }
    for(let i=trail.length-1;i>0;i--){
      const b=trail[i],a=trail[i-1];
      if(a.walked<=target){
        const portion=clamp((target-a.walked)/Math.max(.001,b.walked-a.walked),0,1);
        return {x:a.x+(b.x-a.x)*portion,y:a.y+(b.y-a.y)*portion};
      }
    }
    return trail[0];
  }
  function walkClear(a,b){
    const steps=Math.max(1,Math.ceil(pointDist(a,b)/3));
    for(let i=1;i<=steps;i++){
      const t=i/steps;
      if(blocked(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t,4))return false;
    }
    return true;
  }
  function assignFollower(s,leader,rank){
    s.followId=leader.id;s.followGap=MARCH_GAP*rank;
    s.followGoal=null;s.followTimer=0;s.path=[];
  }
  function detachFromLeader(s,keepDestination=false){
    if(s.followId===null||s.followId===undefined)return;
    const leader=soldiers[s.followId];
    // On split, the other squad keeps marching toward the former command.
    const oldEnd=leader&&leader.path.length?leader.path[leader.path.length-1]:s.followGoal;
    s.followId=null;s.followGoal=null;s.followTimer=0;s.followGap=0;
    s.path=keepDestination&&oldEnd?pathfind(s.x,s.y,oldEnd.x,oldEnd.y):[];
  }
  function releaseFollowersOf(leader){
    for(const s of soldiers)if(s.alive&&s.followId===leader.id)detachFromLeader(s,true);
  }
  function moveSquad(x,y,leaderOverride=null){
    const live=currentSoldiers();if(!live.length)return;
    const leader=live.find(s=>s.id===leaderOverride)||live[0];
    // An individually controlled leader must not drag a different team along.
    for(const s of soldiers)if(s.alive&&s.followId===leader.id&&!live.includes(s))detachFromLeader(s,true);
    for(const s of live)detachFromLeader(s,false);
    const goal={x:clamp(x,18,MW-18),y:clamp(y,18,MH-18)};
    leader.path=pathfind(leader.x,leader.y,goal.x,goal.y);
    startFootsteps(leader);
    let rank=0;
    for(const s of live)if(s!==leader)assignFollower(s,leader,++rank);
    addParticles(x,y,'#f3d676',5,12,'marker');
    sound('move');
  }
  function moveOneSoldier(s,dt,speed=DIFFICULTY.moveSpeed){
    // Skip reached waypoints without wasting a whole frame on each corner.
    while(s.path.length&&dist(s.x,s.y,s.path[0].x,s.path[0].y)<3)s.path.shift();
    if(!s.path.length)return;
    const p=s.path[0],dx=p.x-s.x,dy=p.y-s.y,len=Math.hypot(dx,dy);
    if(len<.001){s.path.shift();return;}
    const step=Math.min(len,speed*dt);
    s.face=Math.atan2(dy,dx);
    const nx=s.x+dx/len*step,ny=s.y+dy/len*step;
    if(!blocked(nx,ny,4)){s.x=nx;s.y=ny;}
    else {s.path=[];s.followTimer=0;}
  }
  function advanceFormation(dt){
    // First move leaders; followers then follow their leaders' current trail.
    for(const s of soldiers){
      if(!s.alive||(s.followId!==null&&s.followId!==undefined))continue;
      moveOneSoldier(s,dt);recordFootsteps(s);
    }
    for(const s of soldiers){
      if(!s.alive||s.followId===null||s.followId===undefined)continue;
      const leader=soldiers[s.followId];
      if(!leader||!leader.alive){detachFromLeader(s,false);continue;}
      const goal=footstepBehind(leader,s.followGap);
      const distanceToGoal=dist(s.x,s.y,goal.x,goal.y);
      s.followTimer=(s.followTimer||0)-dt;
      if(distanceToGoal<4){s.path=[];s.followGoal=goal;continue;}
      const changed=!s.followGoal||pointDist(s.followGoal,goal)>5;
      if(s.followTimer<=0&&(changed||!s.path.length)){
        s.path=walkClear(s,goal)?[{x:goal.x,y:goal.y}]:pathfind(s.x,s.y,goal.x,goal.y);
        s.followGoal={x:goal.x,y:goal.y};
        s.followTimer=distanceToGoal>85?.37:.20;
      }
      // A lagging soldier briefly picks up the pace to keep the formation.
      const speed=DIFFICULTY.moveSpeed*(distanceToGoal>75?1.34:distanceToGoal>34?1.17:1);
      moveOneSoldier(s,dt,speed);
    }
  }
  function nearAimTarget(x,y){
    let target=null,d=21;
    for(const e of enemies){if(!e.alive)continue;const n=dist(x,y,e.x,e.y);if(n<d){d=n;target=e;}}
    if(!bunker.dead&&x>=bunker.x-15&&x<=bunker.x+bunker.w+15&&y>=bunker.y-15&&y<=bunker.y+bunker.h+15)
      return {x:bunker.x+bunker.w*.5,y:bunker.y+bunker.h*.48};
    return target||{x,y};
  }
  function beginFire(x,y){aim=nearAimTarget(x,y);fireUntil=clock+.04;shotClock=0;}
  function updateAim(x,y){aim=nearAimTarget(x,y);}
  function setMode(next){
    if(state!=='playing')return;
    if(next==='grenade'){
      if(grenades<=0){flash('NO GRENADES LEFT',1.3);sound('error');return;}
      mode=mode==='grenade'?'move':'grenade';
      flash(mode==='grenade'?'FRAG ARMED: TAP TARGET':'TAP MOVE  /  HOLD FIRE',1.4);
      return;
    }
    mode='move';
    flash(next==='fire'?'HOLD ON THE FIELD TO FIRE':'TAP MOVE  /  HOLD FIRE',1.4);
  }
  function throwGrenade(x,y){
    if(!grenades){flash('OUT OF GRENADES',1.6);sound('error');return;}
    const alive=currentSoldiers();if(!alive.length)return;
    const s=alive[0];let vx=x-s.x,vy=y-s.y,d=Math.hypot(vx,vy)||1;
    if(d>230){x=s.x+vx/d*230;y=s.y+vy/d*230;}
    grenades--;bombs.push({x:s.x,y:s.y,fromX:s.x,fromY:s.y,toX:x,toY:y,t:0,total:.66});

  }

  // Bullets and enemy sight are stopped by trunks and solid bunker walls;
  // unlike movement, open water is not a barrier to gunfire.
  function shotBlocked(x,y){
    if(!bunker.dead&&x>bunker.x&&x<bunker.x+bunker.w&&y>bunker.y&&y<bunker.y+bunker.h)return true;
    for(const t of trees){
      const r=Math.max(5,t.r*.56);
      if(Math.abs(x-t.x)>r||Math.abs(y-t.y)>r)continue;
      if(dist(x,y,t.x,t.y)<r)return true;
    }
    return false;
  }
  function clearShot(a,b){
    const length=pointDist(a,b),n=Math.ceil(length/7);
    for(let i=2;i<n-1;i++){
      const f=i/n;
      if(shotBlocked(a.x+(b.x-a.x)*f,a.y+(b.y-a.y)*f))return false;
    }
    return true;
  }
  function effect(x,y,kind,angle=0){
    gunEffects.push({x,y,kind,angle,life:kind==='muzzle'?.12:.24,max:kind==='muzzle'?.12:.24});
    if(gunEffects.length>90)gunEffects.splice(0,gunEffects.length-90);
  }
  function alertEnemies(x,y,radius=ENEMY_AI.hearing){
    for(const e of enemies){
      if(!e.alive||dist(e.x,e.y,x,y)>radius)continue;
      e.alert=Math.max(e.alert,ENEMY_AI.alertDuration);
      e.lastKnown={x,y};
      e.wander=0;
    }
  }
  function fireBullet(from,at,owner){
    const direct=Math.atan2(at.y-from.y,at.x-from.x),accuracy=owner==='player'?.046:.112;
    const angle=direct+rand(-accuracy,accuracy);
    const speed=owner==='player'?330:173;
    bullets.push({x:from.x,y:from.y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,owner,life:owner==='player'?1.05:1.7});
    if(owner==='player'){
      playerShots++;
      // The enemies hear nearby gunshots even when a tree hides the shooter.
      alertEnemies(from.x,from.y);
    }
    effect(from.x+Math.cos(angle)*7,from.y+Math.sin(angle)*7,'muzzle',angle);
    addParticles(from.x+Math.cos(angle)*7,from.y+Math.sin(angle)*7,'#fbd65d',2,22,'flash');
  }
  function addParticles(x,y,color,num=9,velocity=30,kind='spark'){
    for(let i=0;i<num;i++){const a=rand(0,6.283),sp=rand(velocity*.2,velocity);
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:kind==='marker'?.35:rand(.18,.7),max:kind==='marker'?.35:.7,color,size:kind==='explosion'?rand(2,6):rand(1,3),kind});
    }
    if(particles.length>290)particles.splice(0,particles.length-290);
  }
  function killSoldier(s){
    if(!s.alive)return;
    // If the leader falls, a surviving follower assumes command rather than
    // abandoning the others on the far side of a bridge.
    const followers=soldiers.filter(q=>q.alive&&q.followId===s.id);
    if(followers.length){
      const destination=s.path.length?s.path[s.path.length-1]:{x:s.x,y:s.y};
      const newLeader=followers[0];detachFromLeader(newLeader,false);
      newLeader.path=pathfind(newLeader.x,newLeader.y,destination.x,destination.y);
      startFootsteps(newLeader);
      followers.slice(1).forEach((q,i)=>assignFollower(q,newLeader,i+1));
    }
    if(s.followId!==null&&s.followId!==undefined)detachFromLeader(s,false);
    s.alive=false;s.path=[];
    fallenBodies.push({x:s.x,y:s.y,face:s.face||0,enemy:false,life:22});
    decals.push({x:s.x,y:s.y,color:'#543f2d',life:60});
    addParticles(s.x,s.y,'#b56a48',15,42,'spark');sound('down');flash(s.name+' HAS FALLEN',3);
    if(selected===s.id)selected=split?s.team:-1;
    if(split&&teamCount('A')===0&&teamCount('B')>0)selected='B';
    else if(split&&teamCount('B')===0&&teamCount('A')>0)selected='A';
    if(!soldiers.some(k=>k.alive)){state='lost';sound('fail');}
  }
  function killEnemy(e){
    if(!e.alive)return;e.alive=false;kills++;score+=100;
    // Nearby guards investigate a casualty rather than remaining oblivious.
    alertEnemies(e.x,e.y,112);
    fallenBodies.push({x:e.x,y:e.y,face:e.dir||0,enemy:true,life:20});
    effect(e.x,e.y,'impact');
    decals.push({x:e.x,y:e.y,color:'#633f32',life:50});
    addParticles(e.x,e.y,'#bd673b',14,36,'spark');sound('hit');
  }
  function explode(x,y){
    sound('boom');addParticles(x,y,'#ffce62',36,94,'explosion');addParticles(x,y,'#dd6932',22,72,'explosion');
    addParticles(x,y,'#343d2e',15,22,'smoke');decals.push({x,y,color:'#3b3d2c',life:90,r:18});
    for(const e of enemies){if(e.alive&&dist(x,y,e.x,e.y)<DIFFICULTY.grenadeRadius)killEnemy(e);}
    if(!bunker.dead&&dist(x,y,bunker.x+bunker.w/2,bunker.y+bunker.h/2)<83){
      bunker.hp=Math.max(0,bunker.hp-5);
      addParticles(bunker.x+bunker.w/2,bunker.y+bunker.h/2,'#c8ae6e',18,72,'explosion');
      checkBunker();
    }
    for(const s of soldiers){if(s.alive&&dist(x,y,s.x,s.y)<22)killSoldier(s);}
  }
  function checkBunker(){
    if(bunker.dead||bunker.hp>0)return;
    bunker.dead=true;score+=500;
    explodeBunker();
    const survivors=soldiers.filter(s=>s.alive).length;
    score+=survivors*250+grenades*30;
    state='won';saveCareer();sound('victory');
  }
  function explodeBunker(){
    for(let i=0;i<4;i++)addParticles(bunker.x+rand(0,bunker.w),bunker.y+rand(0,bunker.h),'#f3b95c',20,100,'explosion');
    decals.push({x:bunker.x+bunker.w/2,y:bunker.y+bunker.h/2,color:'#3a3022',life:999,r:32});
  }

  // Tactical enemy decisions. No map-wide omniscience: guards only engage
  // soldiers within sight, and investigate sounds at the last heard position.
  function enemyMove(e,x,y,dt,speed){
    const dx=x-e.x,dy=y-e.y,d=Math.hypot(dx,dy);
    if(d<3)return true;
    const step=Math.min(d,dt*speed),nx=e.x+dx/d*step,ny=e.y+dy/d*step;
    e.dir=Math.atan2(dy,dx);
    if(blocked(nx,ny,4))return false;
    e.x=nx;e.y=ny;return true;
  }
  function enemyFollowPath(e,path,dt,speed){
    while(path.length&&dist(e.x,e.y,path[0].x,path[0].y)<5)path.shift();
    if(!path.length)return false;
    if(!enemyMove(e,path[0].x,path[0].y,dt,speed))path.shift();
    return path.length>0;
  }
  function enemyFindCover(e,target){
    // Search nearby tree trunks, choosing a reachable point on their far side
    // relative to the visible soldier. This gives genuine, shootable cover.
    let best=null,bestCost=Infinity;
    for(const t of trees){
      const near=dist(e.x,e.y,t.x,t.y);
      if(near>ENEMY_AI.coverRadius)continue;
      const fromThreat=dist(t.x,t.y,target.x,target.y)||1;
      const safe={x:t.x+(t.x-target.x)/fromThreat*(t.r*.72+12),
        y:t.y+(t.y-target.y)/fromThreat*(t.r*.72+12)};
      if(blocked(safe.x,safe.y,4))continue;
      if(clearShot(target,safe))continue;
      const cost=near+dist(e.x,e.y,safe.x,safe.y)*.65;
      if(cost<bestCost){bestCost=cost;best=safe;}
    }
    if(!best){e.coverCooldown=1.8;return false;}
    const path=pathfind(e.x,e.y,best.x,best.y);
    if(!path.length){e.coverCooldown=1.8;return false;}
    e.coverPath=path;e.coverTime=3.5;e.coverCooldown=6.0;
    e.investigatePath=[];return true;
  }
  function updateEnemies(dt,live){
    for(const e of enemies){
      if(!e.alive)continue;
      e.wander-=dt;e.fire-=dt;e.alert=Math.max(0,e.alert-dt);
      e.suppressed=Math.max(0,e.suppressed-dt);
      e.coverTime=Math.max(0,e.coverTime-dt);
      e.coverCooldown=Math.max(0,e.coverCooldown-dt);
      e.investigateTimer=Math.max(0,e.investigateTimer-dt);
      const visible=live.filter(s=>dist(e.x,e.y,s.x,s.y)<DIFFICULTY.enemySight&&clearShot(e,s));
      let target=null,nearest=Infinity;
      for(const s of visible){const d=pointDist(e,s);if(d<nearest){target=s;nearest=d;}}
      e.seen=!!target;
      if(target){
        e.lastKnown={x:target.x,y:target.y};e.alert=ENEMY_AI.alertDuration;
        e.aimTime=Math.min(1,e.aimTime+dt);
      }else e.aimTime=0;
      if(e.suppressed>.35&&e.coverCooldown<=0&&target)enemyFindCover(e,target);
      if(e.coverPath.length){
        e.tactic='seeking cover';
        const finalCover=e.coverPath[e.coverPath.length-1];
        const moving=enemyFollowPath(e,e.coverPath,dt,29);
        if(!moving){
          // Only crouch behind cover if the guard actually reached that cover.
          if(dist(e.x,e.y,finalCover.x,finalCover.y)<13)e.coverTime=Math.max(e.coverTime,1.4);
          else e.coverTime=0;
        }
        continue; // no accurate fire while running to cover
      }
      if(e.coverTime>0){
        e.tactic='in cover';
      } else if(target){
        e.tactic='engaging';
        e.dir=Math.atan2(target.y-e.y,target.x-e.x);
        // Advance deliberately instead of rushing into the player's squad.
        if(nearest>103)enemyMove(e,target.x,target.y,dt,13);
      } else if(e.alert>0&&e.lastKnown){
        e.tactic='investigating';
        if(dist(e.x,e.y,e.lastKnown.x,e.lastKnown.y)>27){
          if(e.investigateTimer===0){
            e.investigatePath=pathfind(e.x,e.y,e.lastKnown.x,e.lastKnown.y);
            e.investigateTimer=2;
          }
          if(!e.investigatePath.length||!enemyFollowPath(e,e.investigatePath,dt,19)){
            enemyMove(e,e.lastKnown.x,e.lastKnown.y,dt,12);
          }
        }
      }else{
        e.tactic='patrol';
        if(e.wander<=0){e.patrolX=e.homeX+rand(-34,34);e.patrolY=e.homeY+rand(-27,27);e.wander=rand(1.8,4.3);}
        if(dist(e.x,e.y,e.patrolX,e.patrolY)>4){
          if(!enemyMove(e,e.patrolX,e.patrolY,dt,17))e.wander=0;
        }
      }
      if(target&&e.aimTime>.35&&e.suppressed<.1&&e.fire<=0&&
        clearShot(e,target)){
        e.dir=Math.atan2(target.y-e.y,target.x-e.x);
        fireBullet({x:e.x+Math.cos(e.dir)*7,y:e.y+Math.sin(e.dir)*7},
          {x:target.x+rand(-7,7),y:target.y+rand(-7,7)},'enemy');
        e.fire=rand(DIFFICULTY.enemyFire,DIFFICULTY.enemyFire+.9);
        sound('enemy');
      }
    }
  }
  function update(dt){
    clock+=dt;if(messageTime>0)messageTime-=dt;if(panHint>0)panHint-=dt;
    advanceFormation(dt);
    const live=soldiers.filter(s=>s.alive);
    updateEnemies(dt,live);
    if((gesture&&gesture.firing)||clock<fireUntil){
      for(const s of currentSoldiers()){
        s.fire-=dt;
        if(s.fire<=0){
          s.face=Math.atan2(aim.y-s.y,aim.x-s.x);
          fireBullet({x:s.x+Math.cos(s.face)*9,y:s.y+Math.sin(s.face)*9},aim,'player');
          s.fire=DIFFICULTY.gunRate+rand(0,.055);
          if(Math.random()<.45)sound('gun');
        }
      }
    } else for(const s of soldiers)s.fire=Math.max(0,s.fire-dt);
    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i],x0=b.x,y0=b.y; b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
      let impact=false;
      const steps=Math.max(1,Math.ceil(dist(x0,y0,b.x,b.y)/4));
      for(let j=1;j<=steps&&!impact;j++){
        const x=x0+(b.x-x0)*j/steps,y=y0+(b.y-y0)*j/steps;
        if(x<4||y<4||x>MW-4||y>MH-4){impact=true;break;}
        if(b.owner==='player'){
          for(const e of enemies){
            if(!e.alive)continue;
            const near=dist(x,y,e.x,e.y);
            if(near<7){killEnemy(e);impact=true;break;}
            if(near<ENEMY_AI.suppressionRadius&&e.suppressed<.12){
              e.suppressed=.85;e.alert=ENEMY_AI.alertDuration;
              e.lastKnown={x:b.x-b.vx*.15,y:b.y-b.vy*.15};
              addParticles(e.x,e.y,'#e6c778',2,15,'spark');
            }
          }
          if(!impact&&!bunker.dead&&x>=bunker.x&&x<=bunker.x+bunker.w&&y>=bunker.y&&y<=bunker.y+bunker.h){
            bunker.hp=Math.max(0,bunker.hp-.13);impact=true;
            effect(x,y,'impact');addParticles(x,y,'#e6ca73',4,22,'spark');checkBunker();
          }
        }else{
          for(const s of soldiers){if(s.alive&&dist(x,y,s.x,s.y)<5.3){killSoldier(s);impact=true;break;}}
        }
        if(!impact&&shotBlocked(x,y)){
          impact=true;effect(x,y,'impact');
          if(Math.random()<.65)addParticles(x,y,'#b8a579',3,19,'spark');
        }
        if(impact&&Math.random()<.18)decals.push({x,y,color:'#6a5938',life:7,r:2});
      }
      if(impact||b.life<=0)bullets.splice(i,1);
    }
    for(let i=bombs.length-1;i>=0;i--){
      const b=bombs[i];b.t+=dt;const k=clamp(b.t/b.total,0,1);
      b.x=b.fromX+(b.toX-b.fromX)*k;b.y=b.fromY+(b.toY-b.fromY)*k;
      if(b.t>=b.total){explode(b.toX,b.toY);bombs.splice(i,1);}
    }
    if(!ammo.taken&&live.some(s=>dist(s.x,s.y,ammo.x,ammo.y)<17)){
      ammo.taken=true;grenades=Math.min(6,grenades+2);score+=50;flash('AMMO SUPPLY: +2 GRENADES',2.5);sound('pickup');
      addParticles(ammo.x,ammo.y,'#ffd76a',17,30,'spark');
    }
    for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;
      p.vx*=1-2*dt;p.vy*=1-2*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1);
    }
    for(let i=decals.length-1;i>=0;i--){decals[i].life-=dt;if(decals[i].life<=0)decals.splice(i,1);}
    for(let i=gunEffects.length-1;i>=0;i--){gunEffects[i].life-=dt;if(gunEffects[i].life<=0)gunEffects.splice(i,1);}
    for(let i=fallenBodies.length-1;i>=0;i--){fallenBodies[i].life-=dt;if(fallenBodies[i].life<=0)fallenBodies.splice(i,1);}
    followCamera(dt);
  }
  function clampCamera(){cam.x=clamp(cam.x,0,Math.max(0,MW-VW));cam.y=clamp(cam.y,0,MH-VH);}
  function followCamera(dt){
    let focus=currentSoldiers();if(!focus.length)focus=soldiers.filter(s=>s.alive);
    if(focus.length){
      const lead=focus.find(s=>s.followId===null||s.followId===undefined)||focus[0];
      const tx=lead.x-VW*.41,ty=lead.y-VH*.56;
      const speed=1-Math.exp(-dt*4.9);
      cam.x+=(tx-cam.x)*speed;cam.y+=(ty-cam.y)*speed;
    }
    clampCamera();
  }

    c.fillStyle='#273322';c.fillRect(-4,-6,6,4);c.fillRect(-4,5,3,5+move);c.fillRect(2,5,3,5-move);
    c.fillStyle=enemy?'#a26336':'#54683b';c.fillRect(-5,-4,11,11);

      ctx.fillStyle='#312e22';ctx.fillRect(Math.round(b.x)-4,Math.round(b.y-rise)-3,7,7);
      ctx.fillStyle='#b4a26b';ctx.fillRect(Math.round(b.x)-3,Math.round(b.y-rise)-2,4,2);

  function drawEnd(won){
    shade(.82);const x=HUD+VW/2;
    text(won?'MISSION COMPLETE':'MISSION FAILED',x,27,won?24:25,won?C.gold:'#e78a6d','center');
    text(won?'RADIO BUNKER DESTROYED':'ALPHA SQUAD LOST',x,65,11,C.cream,'center');
    rect(x-127,84,254,2,'#71834f');
    const alive=soldiers.filter(s=>s.alive).length;
    text('ROLL CALL',x,97,10,C.mint,'center');
    soldiers.forEach((s,i)=>{
      text(`${s.name}  ${s.alive?'SURVIVED  ★':'KIA   ×'}`,x,115+i*16,11,s.alive?'#d9e4b3':'#d97f6a','center');
    });
    text(`ENEMIES ${String(kills).padStart(2,'0')}    SCORE ${score}`,x,168,11,C.sand,'center');
    const w=Math.min(222,VW-50);resultStart={x:x-w/2,y:201,w,h:38};
    button(resultStart.x,resultStart.y,w,38,won?'►  REPLAY MISSION':'►  TRY AGAIN','retry',true);
    text(won?'PROGRESS SAVED ON THIS DEVICE':'KEEP YOUR SQUAD OUT OF ENEMY FIRE',x,247,8,'#9fad87','center');
  }
  function draw(){
    rect(0,0,W,WH,'#141c15');
    if(terrain)drawWorld();
    drawHud();
    drawControls();
    if(state==='title')drawTitle();
    else if(state==='paused')drawPause();
    else if(state==='won')drawEnd(true);
    else if(state==='lost')drawEnd(false);
    // Border and small top HUD separators.
    rect(HUD-3,0,3,WH,'#101711');
    if(state==='playing'&&panHint>0){
      const right=HUD+VW-9;
      text('MOVE / FIRE / GRENADE',right,5,8,'#d6e4b2','right');
    }
  }

  function audioInit(){
    if(!audioOn)return;
    if(!audioCtx)try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(_){return;}
    if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
    hasAudio=true;
  }
  function tone(freq,duration,type='square',volume=.03,slide=0){
    if(!audioOn||!audioCtx)return;
    const t=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
    osc.type=type;osc.frequency.setValueAtTime(freq,t);
    if(slide)osc.frequency.exponentialRampToValueAtTime(Math.max(25,freq+slide),t+duration);
    gain.gain.setValueAtTime(volume,t);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
    osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+duration+.01);
  }
  function sound(name){
    if(!hasAudio||!audioOn)return;
    if(name==='gun')tone(200,.055,'sawtooth',.016,-125);
    else if(name==='enemy')tone(100,.04,'sawtooth',.006,-52);
    else if(name==='boom'){tone(88,.32,'sawtooth',.065,-65);tone(45,.28,'triangle',.07,-20);}
    else if(name==='throw')tone(290,.08,'triangle',.014,-125);
    else if(name==='hit')tone(210,.09,'triangle',.023,-140);
    else if(name==='move')tone(480,.032,'sine',.012,-80);
    else if(name==='pickup'){tone(440,.12,'square',.020,220);}
    else if(name==='down')tone(175,.42,'triangle',.045,-130);
    else if(name==='fail')tone(100,.48,'sawtooth',.045,-70);
    else if(name==='start')tone(580,.18,'triangle',.025,200);
    else if(name==='victory'){
      tone(420,.3,'triangle',.040,160);
      // A short original ascending two-tone victory cue, not a sampled song.
    }
    else if(name==='error')tone(130,.12,'square',.02,-30);
  }

  function where(e){
    const r=canvas.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*WH;
    return{x,y,wx:x-HUD+cam.x,wy:y+cam.y};
  }
  function inside(p,b){return p.x>=b.x&&p.x<b.x+b.w&&p.y>=b.y&&p.y<b.y+b.h;}
  function cancelGesture(){
    gesture=null;hudPress=null;pointer.firePointer=null;pointer.down=false;mouseRight=false;fireUntil=0;
  }
  function onPointerDown(e){
    if(e.cancelable)e.preventDefault();
    // Ignore additional fingers: one battlefield gesture at a time.
    if(gesture||hudPress)return;
    canvas.focus();audioInit();
    const p=where(e);Object.assign(pointer,p);pointer.down=true;
    try{canvas.setPointerCapture(e.pointerId);}catch(_){}
    if(state==='title'){if(inside(p,titleStart))resetMission();return;}
    if(state==='paused'){if(inside(p,resultStart))state='playing';return;}
    if(state==='won'||state==='lost'){if(inside(p,resultStart))resetMission();return;}
    if(p.x<HUD){
      if(p.y>=47&&p.y<66){if(split)chooseTeam(p.x<55?'A':'B');else chooseSquad(-1);}
      else if(p.y>=69&&p.y<165){
        const i=Math.floor((p.y-69)/32);
        if(i>=0&&i<3)hudPress={id:e.pointerId,soldier:i,started:performance.now(),done:false};
      }
      return;
    }
    if(p.y>=CTRL_Y){
      const hit=buttons().find(b=>inside(p,{x:b.x,y:CTRL_Y,w:b.w,h:35}));
      if(hit){
        if(hit.mode==='pause'){state='paused';cancelGesture();}
        else if(hit.mode==='sound'){audioOn=!audioOn;try{localStorage.setItem('green-dawn-audio-v2',audioOn?'on':'off');}catch(_){}if(audioOn)audioInit();}
        else if(hit.mode==='split')toggleSplit();
        else setMode(hit.mode);
      }
      return;
    }
    if(mode==='grenade'&&e.button!==2){throwGrenade(p.wx,p.wy);return;}
    // Do NOT move immediately. A release before the threshold issues a move;
    // a long press begins sustained fire towards the finger instead.
    gesture={id:e.pointerId,started:performance.now(),x:p.x,y:p.y,wx:p.wx,wy:p.wy,firing:e.button===2};
    if(gesture.firing){pointer.firePointer=e.pointerId;beginFire(p.wx,p.wy);}
  }
  function onPointerMove(e){
    if(gesture&&e.pointerId!==gesture.id)return;
    const p=where(e);Object.assign(pointer,p);
    if(gesture&&state==='playing'){
      gesture.x=clamp(p.x,HUD+1,W-2);
      gesture.y=clamp(p.y,1,CTRL_Y-2);
      gesture.wx=gesture.x-HUD+cam.x;gesture.wy=gesture.y+cam.y;
      if(gesture.firing)updateAim(gesture.wx,gesture.wy);
    }
  }
  function onPointerUp(e){
    if((gesture&&e.pointerId!==gesture.id)||(hudPress&&e.pointerId!==hudPress.id))return;
    if(hudPress){
      const press=hudPress;hudPress=null;
      if(!press.done&&e.type!=='pointercancel'&&state==='playing')chooseSquad(press.soldier);
      pointer.down=false;
      try{if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);}catch(_){}
      return;
    }
    if(gesture){
      const elapsed=performance.now()-gesture.started;
      if(state==='playing'&&!gesture.firing&&elapsed<HOLD_TO_FIRE_MS&&e.type!=='pointercancel'){
        moveSquad(gesture.wx,gesture.wy);
      }
      cancelGesture();
    }else pointer.down=false;
    try{if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);}catch(_){}
  }
  function pauseForBackground(){
    if(state==='playing'){state='paused';cancelGesture();}
  }
  function onKey(e){
    if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
    if(e.code==='KeyR'){if(state!=='title'){resetMission();}return;}
    if(e.code==='KeyP'||e.code==='Escape'){
      if(state==='playing'){state='paused';cancelGesture();}
      else if(state==='paused')state='playing';return;
    }
    if(state==='title'&&(e.code==='Enter'||e.code==='Space')){audioInit();resetMission();return;}
    if(state==='won'||state==='lost'){if(e.code==='Enter'||e.code==='Space'){audioInit();resetMission();}return;}
    if(state!=='playing')return;
    if(e.code==='Digit0')chooseSquad(-1);
    if(e.code==='KeyX')toggleSplit();
    if(e.code==='Digit4')chooseTeam('A');
    if(e.code==='Digit5')chooseTeam('B');
    if(['Digit1','Digit2','Digit3'].includes(e.code))chooseSquad(Number(e.code.slice(-1))-1);
    if(e.code==='KeyM')setMode('move');
    if(e.code==='KeyF')setMode('fire');
    if(e.code==='KeyG')setMode('grenade');
    if(e.code==='Space'){beginFire(pointer.wx,pointer.wy);}
  }
  let last=performance.now();
  function tick(t){const dt=clamp((t-last)/1000,0,.04);last=t;timeNow=t;
    if(state==='playing'&&hudPress&&!hudPress.done&&split&&t-hudPress.started>=520){
      hudPress.done=true;transferSoldier(hudPress.soldier);
    }
    if(state==='playing'&&gesture){
      if(!gesture.firing&&t-gesture.started>=HOLD_TO_FIRE_MS){
        gesture.firing=true;pointer.firePointer=gesture.id;
        beginFire(gesture.wx,gesture.wy);
      }
      if(gesture.firing){
        // Recalculate aim as the camera follows moving soldiers underneath a held finger.
        updateAim(gesture.x-HUD+cam.x,gesture.y+cam.y);
      }
    }
    if(state==='playing')update(dt);
    draw();requestAnimationFrame(tick);
  }
  canvas.addEventListener('pointerdown',onPointerDown,{passive:false});
  canvas.addEventListener('pointermove',onPointerMove,{passive:false});
  canvas.addEventListener('pointerup',onPointerUp,{passive:false});
  canvas.addEventListener('pointercancel',onPointerUp,{passive:false});
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  window.addEventListener('keydown',onKey);
  window.addEventListener('resize',resize);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseForBackground();});
  window.addEventListener('pagehide',pauseForBackground);
  window.addEventListener('green-dawn-pause',pauseForBackground);
  loadSave();resize();generateTerrain();
  soldiers=[{name:'JAX',x:111,y:573,alive:true,team:'A',path:[],face:-.6,id:0},{name:'ACE',x:95,y:592,alive:true,team:'A',path:[],face:-.6,id:1},{name:'PIP',x:120,y:604,alive:true,team:'A',path:[],face:-.6,id:2}];
  enemies=[];bunker={x:871,y:119,w:67,h:53,hp:8,maxHp:8,dead:false};ammo={x:461,y:371,taken:false};
  cam={x:0,y:MH-VH};
  // Expose a tiny read-only test surface to catch playability regressions.
  Object.defineProperty(window,'GREEN_DAWN_TEST',{value:{
    get status(){return {state,mode,score,kills,grenades,alive:soldiers.filter(s=>s.alive).length,enemyCount:enemies.filter(e=>e.alive).length,bunkerHp:bunker.hp,camera:{...cam},time:clock};},
    get controls(){return {pending:!!(gesture&&!gesture.firing),firing:!!(gesture&&gesture.firing),shotsFired:playerShots,aim:{...aim},holdMs:HOLD_TO_FIRE_MS};},
    get roster(){return soldiers.map(s=>({name:s.name,x:s.x,y:s.y,alive:s.alive,team:s.team,followId:s.followId??null,followGap:s.followGap||0,trailPoints:s.trail?.length||0,followGoal:s.followGoal||null,pathLength:s.path.length,destination:s.path.at(-1)||null}));},
    get squads(){return {split,selected,alpha:soldiers.filter(s=>s.alive&&s.team==='A').map(s=>s.name),bravo:soldiers.filter(s=>s.alive&&s.team==='B').map(s=>s.name)};},
    get enemyAI(){return enemies.map(e=>({id:e.id,alive:e.alive,x:e.x,y:e.y,tactic:e.tactic,
      alert:e.alert,suppressed:e.suppressed,coverTime:e.coverTime,coverPath:e.coverPath.length}));},
    get combatEffects(){return {gunEffects:gunEffects.length,fallenBodies:fallenBodies.length};},
    toggleSplit:()=>toggleSplit(),
    selectTeam:(team)=>chooseTeam(team),
    transfer:(id)=>transferSoldier(id),
    commandMove:(x,y,leadId)=>moveSquad(x,y,leadId),
    commandFire:(x,y)=>{beginFire(x,y);fireUntil=clock+2.5;},
    commandGrenade:(x,y)=>throwGrenade(x,y),
    start:()=>resetMission(),
    select:(id)=>chooseSquad(id),
    setMode:(id)=>setMode(id),
    get walkable(){return mapData.filter(Boolean).length;},
    path:(ax,ay,bx,by)=>pathfind(ax,ay,bx,by)
  }});
  // Android WebView uses a virtual HTTPS origin and already contains all the
  // files offline. Do not register a Service Worker on that synthetic host.
  if('serviceWorker' in navigator && location.protocol.startsWith('http') && location.hostname!=='appassets.androidplatform.net'){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
  requestAnimationFrame(tick);
})();

</script>
